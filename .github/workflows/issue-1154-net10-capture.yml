name: Buffered allocation ownership replicas (#1154)

on:
  push:
    branches: [diagnostics/issue-1154-current-main-replicas]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  capture:
    name: Allocation ownership (${{ matrix.replica.name }})
    strategy:
      fail-fast: false
      matrix:
        replica:
          - name: main-1
            checkout: 11005a514e429bd302e261337dc5a5a764269cb0
          - name: main-2
            checkout: 11005a514e429bd302e261337dc5a5a764269cb0
          - name: known-recurrence
            checkout: 5e064a687be1cc2ccd52518702dca7ee6a569fb3
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      ORIGINAL_CHECKOUT: ${{ matrix.replica.checkout }}
      FRAMEWORK: net10.0
      CAPTURE_PAIRS: '65536'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_NOLOGO: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dotnet/samples
          ref: 3810558800760fc39282cc939bac645735514209
          path: profiler-sdk
          sparse-checkout: core/profiling
          persist-credentials: false
      - name: Separate Docker publications from outbound ports
        run: sudo bash scripts/Prepare-ContainerTests.sh
      - uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6
        with:
          version: v29.10.0
          set-host: true
          daemon-config: '{"userland-proxy": false}'
      - name: Verify mixed-address port allocation and forwarding
        run: bash scripts/Test-ContainerPortAllocation.sh
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json
          dotnet-version: '10.0.404'
      - name: Build the CI solution checkout
        id: build
        run: |
          mkdir -p results .artifacts
          git fetch --no-tags origin "$ORIGINAL_CHECKOUT"
          git worktree add --detach .artifacts/ci-source "$ORIGINAL_CHECKOUT"
          git -C .artifacts/ci-source rev-parse HEAD > results/checkout.txt
          git rev-parse HEAD > results/diagnostic-commit.txt
          dotnet --info > results/runtime.txt
          selected_patch=$(dotnet --list-runtimes | awk '$1 == "Microsoft.NETCore.App" && $2 ~ /^10[.]0[.]/ {print $2}' | sort -V | tail -n 1)
          test "$selected_patch" = 10.0.15
          uname -a > results/host.txt
          cat /etc/os-release >> results/host.txt
          nproc >> results/host.txt

          mkdir -p .artifacts/history
          git archive 489ce7079df1f92788b76dd8c8e191f46707b827 \
            tools/FrozenAllocationProfiler .github/scripts/read_native_allocations.py \
            .github/scripts/read_allocation_stacks.py | tar -x -C .artifacts/history
          patch -d .artifacts/history -p1 < .github/scripts/issue-1154-profiler-target.patch
          CXX=clang++ cmake -S .artifacts/history/tools/FrozenAllocationProfiler \
            -B .artifacts/profiler -DPROFILER_SAMPLES="$PWD/profiler-sdk" -DCMAKE_BUILD_TYPE=Release
          cmake --build .artifacts/profiler
          git -C .artifacts/ci-source apply --unidiff-zero "$PWD/.github/scripts/issue-1154-combined-checkpoints.patch"
          cp .github/scripts/Issue1154AllocationRegion.cs .artifacts/ci-source/tests/Relayer.Tests/

          cd .artifacts/ci-source
          dotnet restore
          dotnet build --no-restore -c Release
      - name: Record the core test runtime configuration
        run: cp ".artifacts/ci-source/tests/Relayer.Tests/bin/Release/$FRAMEWORK/Relayer.Tests.runtimeconfig.json" results/
      - name: Prefetch CI broker images
        run: |
          docker pull apache/kafka:4.0.2
          docker pull postgres:18-alpine
          docker pull mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
          docker pull mysql:8.4
          docker pull gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:112c21f8f6e04b03b393b3c34fb943a1f443e839f18c6492c364ac2e6c3ff935
          docker pull ghcr.io/shopify/toxiproxy@sha256:5d3dae09bc185dcc5ff6cf43abf6062a4a720aff0c4306a471e773acdcd107aa
      - name: Run the parallel solution tests through MTP
        timeout-minutes: 10
        run: bash .github/scripts/run-issue-1154-solution.sh
      - name: Validate same-execution caller and stack coverage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 .github/scripts/summarize-issue-1154.py results --caller-only --pairs "$CAPTURE_PAIRS" \
            | tee results/caller-summary.txt
          PYTHONPATH=.artifacts/history/.github/scripts python3 - <<'PY' > results/validated-coverage.json
          import json
          from pathlib import Path

          from read_allocation_stacks import validate
          from read_native_allocations import read

          report = read("results/objects.jsonl")
          with Path("results/stacks.jsonl").open(encoding="utf-8") as stream:
              stacks = validate([json.loads(line) for line in stream], report)
          print(json.dumps({
              "native": report["coverage"],
              "stacks": stacks["coverage"],
              "unresolved_frames": stacks["unresolved_frames"],
          }, indent=2))
          PY
      - name: Validate counter boundaries and effective GC settings
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          cat results/boundaries.csv.gc.txt
          grep -iq '^ConcurrentGC=false$' results/boundaries.csv.gc.txt
          python3 .github/scripts/summarize-issue-1154-boundaries.py results/boundaries.csv --pairs "$CAPTURE_PAIRS" \
            | tee results/boundary-summary.txt
      - name: Inventory the retained diagnostics
        if: always()
        run: |
          paths=(results)
          for path in ".artifacts/ci-source/tests/Relayer.Tests/bin/Release/$FRAMEWORK" \
            .artifacts/profiler/libFrozenAllocationProfiler.so; do
            if [[ -e "$path" ]]; then
              paths+=("$path")
            fi
          done
          find "${paths[@]}" -type f -exec sha256sum {} + > results-sha256.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: allocation-net10-profiled-${{ matrix.replica.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            results-sha256.txt
            .artifacts/ci-source/tests/Relayer.Tests/bin/Release/${{ env.FRAMEWORK }}/
            .artifacts/profiler/libFrozenAllocationProfiler.so
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
