name: Buffered allocation counter boundaries (#1154)

on:
  push:
    branches: [diagnostics/issue-1154-counter-boundaries]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  capture:
    name: Measure allocation counter boundaries without a profiler
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      ORIGINAL_CHECKOUT: 0c587b95ab2f162d0caa0ce27eb93441f73bf56f
      FRAMEWORK: net11.0
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Separate Docker publications from outbound ports
        run: sudo bash scripts/Prepare-ContainerTests.sh
      - uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6
        with:
          version: v29.10.0
          set-host: true
          daemon-config: '{"userland-proxy": false}'
      - name: Verify mixed-address port allocation and forwarding
        run: bash scripts/Test-ContainerPortAllocation.sh
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json
          dotnet-version: '10.0.404'
      - name: Build the original CI solution with counter checkpoints
        id: build
        run: |
          mkdir -p results .artifacts
          git worktree add --detach .artifacts/ci-source "$ORIGINAL_CHECKOUT"
          git -C .artifacts/ci-source rev-parse HEAD > results/checkout.txt
          git rev-parse HEAD > results/diagnostic-commit.txt
          dotnet --info > results/runtime.txt
          uname -a > results/host.txt
          cat /etc/os-release >> results/host.txt
          nproc >> results/host.txt

          cp tests/Relayer.Tests/BatchPipelineTests.cs .artifacts/ci-source/tests/Relayer.Tests/
          cd .artifacts/ci-source
          dotnet restore
          dotnet build --no-restore -c Release
      - name: Prefetch CI broker images
        run: |
          docker pull apache/kafka:4.0.2
          docker pull postgres:18-alpine
          docker pull mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
          docker pull mysql:8.4
          docker pull gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:112c21f8f6e04b03b393b3c34fb943a1f443e839f18c6492c364ac2e6c3ff935
          docker pull ghcr.io/shopify/toxiproxy@sha256:5d3dae09bc185dcc5ff6cf43abf6062a4a720aff0c4306a471e773acdcd107aa
      - name: Run the parallel solution tests through MTP
        timeout-minutes: 10
        run: |
          results="$PWD/results"
          cd .artifacts/ci-source
          status=0
          timeout --kill-after=10s 8m dotnet test --no-build -c Release -f "$FRAMEWORK" \
            --environment "RELAYER_ALLOCATION_BOUNDARIES=$results/boundaries.csv" \
            > "$results/tests.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$results/exit-code"
          grep -aE 'Warmed_batches_add_no_allocations|Batch [0-9]+: native DI|Test run summary|Test run failed' \
            "$results/tests.log" || true
          exit "$status"
      - name: Check counter transitions and effective GC configuration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          cat results/boundaries.csv.gc.txt
          python3 .github/scripts/summarize-issue-1154-boundaries.py results/boundaries.csv \
            | tee results/boundary-summary.txt
      - name: Inventory the retained diagnostics
        if: always()
        run: |
          paths=(results)
          path=".artifacts/ci-source/tests/Relayer.Tests/bin/Release/$FRAMEWORK"
          if [[ -e "$path" ]]; then
            paths+=("$path")
          fi
          find "${paths[@]}" -type f -exec sha256sum {} + > results-sha256.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: allocation-counter-boundaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            results-sha256.txt
            .artifacts/ci-source/tests/Relayer.Tests/bin/Release/${{ env.FRAMEWORK }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
