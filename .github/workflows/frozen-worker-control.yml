name: Frozen original-waiter worker allocation control

# #430: discriminate concrete pending-read and pooled-source owners; never rerun a gate.
on:
  pull_request:
    paths:
      - 'tools/FrozenDriverProbe/**'
      - 'tools/FrozenFixtureProbe/InvocationAllocations.cs'
      - '.github/scripts/frozen_concurrent_control.py'
      - '.github/workflows/frozen-worker-control.yml'
  workflow_dispatch:
    inputs:
      performance_run:
        description: Retained Performance run for separate exact worker controls
        type: string
        default: "42760437053"

permissions:
  contents: read
  actions: read

jobs:
  workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PERFORMANCE_RUN: ${{ inputs.performance_run || '42760437053' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.403'
      - name: Record host, verify launcher and build external probe
        run: |
          mkdir -p results
          dotnet --info > results/runtime.txt
          uname -a > results/host.txt
          python3 -m unittest discover -s .github/scripts -p test_frozen_concurrent_control.py > results/launcher-tests.log 2>&1
          dotnet build tools/FrozenDriverProbe -c Release > results/build.log 2>&1
      - name: Download exact original inputs and measure separate worker controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$PERFORMANCE_RUN" =~ ^[0-9]+$ ]] || { echo "Invalid run ID: $PERFORMANCE_RUN" >&2; exit 1; }
          gh run download "$PERFORMANCE_RUN" --name "performance-$PERFORMANCE_RUN-1" --dir inputs
          python3 .github/scripts/frozen_concurrent_control.py inputs tools/FrozenDriverProbe/bin/Release/net10.0/FrozenDriverProbe.dll results/exact-worker --exact-worker
      - name: Retain every outcome and exact executable input
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frozen-worker-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            inputs/
            tools/FrozenDriverProbe/
            tools/FrozenFixtureProbe/InvocationAllocations.cs
            tools/FrozenMeasurementEvents.cs
            .github/scripts/frozen_concurrent_control.py
            .github/workflows/frozen-worker-control.yml
          retention-days: 90
