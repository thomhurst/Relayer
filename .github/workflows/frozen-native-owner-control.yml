name: Frozen native-engine owner capture

# #430: test owner families under the native engine, never rerun a performance gate.
on:
  pull_request:
    paths:
      - '.github/scripts/frozen_bdn_control.py'
      - '.github/scripts/test_frozen_bdn_control.py'
      - '.github/scripts/frozen_concurrent_control.py'
      - 'tools/FrozenAllocationReader/**'
      - '.github/workflows/frozen-native-owner-control.yml'
  workflow_dispatch:
    inputs:
      performance_run:
        description: Retained Performance run to investigate (empty keeps historical default)
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.403'
      - name: Record host and verify launcher
        run: |
          mkdir -p results
          dotnet --info > results/runtime.txt
          uname -a > results/host.txt
          python3 -m unittest discover -s .github/scripts -p test_frozen_bdn_control.py > results/launcher-tests.log 2>&1
          dotnet build tools/FrozenAllocationReader -c Release > results/reader-build.log 2>&1
      - name: Install pinned native profiler
        run: dotnet tool install dotnet-trace --tool-path .diagnostic-tools --version 10.0.750501 > results/trace-install.log 2>&1
      - name: Download original images and capture separate instrumented native-engine ABBA
        env:
          GH_TOKEN: ${{ github.token }}
          PERFORMANCE_RUN: ${{ inputs.performance_run || '42760437053' }}
        run: |
          [[ "$PERFORMANCE_RUN" =~ ^[0-9]+$ ]] || { echo "Invalid Performance run ID: $PERFORMANCE_RUN" >&2; exit 1; }
          gh run download "$PERFORMANCE_RUN" --name "performance-$PERFORMANCE_RUN-1" --dir inputs
          python3 .github/scripts/frozen_bdn_control.py inputs results/profiled-native-engine --trace-tool .diagnostic-tools/dotnet-trace
      - name: Extract whole-process sampled owners without measurement markers
        if: always()
        run: |
          shopt -s nullglob
          traces=(results/profiled-native-engine/*.nettrace)
          (( ${#traces[@]} > 0 )) || { echo "No native allocation captures to inspect" >&2; exit 1; }
          failed=0
          for trace in "${traces[@]}"; do
            dotnet tools/FrozenAllocationReader/bin/Release/net10.0/FrozenAllocationReader.dll "$trace" --whole-process > "$trace.owners.jsonl" 2> "$trace.reader.log" || failed=1
          done
          exit "$failed"
      - name: Retain all outcomes and executable inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frozen-native-owner-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            inputs/
            .diagnostic-tools/
            .github/workflows/frozen-native-owner-control.yml
            .github/scripts/frozen_bdn_control.py
            .github/scripts/test_frozen_bdn_control.py
            .github/scripts/frozen_concurrent_control.py
            tools/FrozenAllocationReader/
          retention-days: 90
