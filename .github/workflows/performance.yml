name: Performance

# The benchmark regression gate is advisory: it is not part of `CI Passed`, so it never blocks a
# merge. It runs on every push to main (comparing with the previous main head), on demand, and on
# ready pull requests that carry the `performance` label or change the gate itself.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      nats_native:
        description: Run NATS native-client comparisons instead of the main regression gate
        type: boolean
        default: false
      nats_allocations:
        description: Capture separate NATS send/receive allocation traces (requires nats_native)
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

# A newer commit cancels an older run. Adding an unrelated label gets its own group, so it cannot
# cancel a gate that is already running.
concurrency:
  group: >-
    performance-${{ github.event.pull_request.number || github.ref }}${{
    github.event.action == 'labeled' && github.event.label.name != 'performance'
    && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  scope:
    name: Decide whether to benchmark
    if: >-
      inputs.nats_native != true
      && (github.event_name != 'pull_request'
          || (github.event.pull_request.draft == false
              && (github.event.action != 'labeled' || github.event.label.name == 'performance')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: >-
        ${{ github.event_name != 'pull_request'
        || contains(github.event.pull_request.labels.*.name, 'performance')
        || steps.filter.outputs.gate == 'true' }}
    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            gate:
              - 'benchmarks/Relayer.Benchmarks/RegressionGate/**'
              - 'benchmarks/Relayer.Benchmarks/Program.cs'
              - 'benchmarks/Relayer.Benchmarks/Relayer.Benchmarks.csproj'
              - '.github/scripts/benchmark_gate.py'
              - '.github/scripts/test_benchmark_gate.py'
              - '.github/scripts/pin_benchmark_version.py'
              - '.github/scripts/retain_benchmark_evidence.py'
              - '.github/scripts/test_retain_benchmark_evidence.py'
              - '.github/workflows/performance.yml'

  performance:
    name: Performance regression gate
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # Pin main once. Pull requests compare to their target snapshot; pushes compare to the
      # previous main head. Manual runs compare the selected head to the current main snapshot.
      - name: Pin comparison commits
        id: commits
        working-directory: candidate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            baseline="$PR_BASE"
          elif [ "$EVENT_NAME" = push ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then
            baseline="$PUSH_BEFORE"
          else
            baseline="$(git rev-parse origin/main)"
          fi
          git cat-file -e "$baseline^{commit}"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          echo "Baseline: $baseline; candidate: $(git rev-parse HEAD)" | tee ../performance-commits.txt

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: baseline
          ref: ${{ steps.commits.outputs.baseline }}

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: candidate/global.json
          dotnet-version: '10.0.x' # runtime for the net10.0 benchmarks; global.json selects the 11.0 SDK

      # Only Program.cs and RegressionGate/ enter either build. Benchmarks a PR adds for new
      # APIs therefore never have to compile against main, and the source generator sees the
      # same message and handler set on both sides. Each side keeps its own project file, so a
      # new project reference on the candidate cannot break the baseline restore.
      - name: Use identical benchmark harnesses
        run: |
          harness=benchmarks/Relayer.Benchmarks
          for tree in candidate baseline; do
            find "$tree/$harness" -name '*.cs' -not -path "$tree/$harness/RegressionGate/*" -not -path "$tree/$harness/Program.cs" -delete
          done
          rm -rf "baseline/$harness/RegressionGate"
          cp -r "candidate/$harness/RegressionGate" "baseline/$harness/RegressionGate"
          cp "candidate/$harness/Program.cs" "baseline/$harness/Program.cs"
          diff -r --exclude='*.csproj' "candidate/$harness" "baseline/$harness"
          cp candidate/global.json baseline/global.json
          python3 candidate/.github/scripts/pin_benchmark_version.py candidate baseline >> performance-commits.txt
          candidate_sdk="$(cd candidate && dotnet --version)"
          baseline_sdk="$(cd baseline && dotnet --version)"
          test "$candidate_sdk" = "$baseline_sdk"
          echo "SDK: $candidate_sdk" >> performance-commits.txt
          find "candidate/$harness" -name '*.cs' -print0 | sort -z | xargs -0 sha256sum > performance-harness.sha256

      - name: Test regression detector and evidence retention
        run: |
          python3 -m unittest discover -s candidate/.github/scripts -p test_benchmark_gate.py -v
          python3 -m unittest discover -s candidate/.github/scripts -p test_retain_benchmark_evidence.py -v

      - name: Benchmark main snapshot
        id: baseline
        working-directory: baseline
        run: |
          dotnet run -c Release --project benchmarks/Relayer.Benchmarks -- \
            --filter '*' --anyCategories RegressionGate --exporters fulljson --keepFiles \
            --artifacts "$GITHUB_WORKSPACE/performance-results/baseline" \
            > "$GITHUB_WORKSPACE/performance-baseline.log" 2>&1 \
            || { tail -n 80 "$GITHUB_WORKSPACE/performance-baseline.log"; exit 1; }

      # BDN can reuse a generated directory on the next execution. Copy each
      # image before the next build, including when a measurement failed.
      - name: Preserve first baseline benchmark build
        if: always() && steps.baseline.outcome != 'skipped'
        run: python3 candidate/.github/scripts/retain_benchmark_evidence.py baseline performance-builds/baseline

      - name: Prove unchanged measurements pass and injected regressions fail
        run: python3 candidate/.github/scripts/benchmark_gate.py self-test performance-results/baseline

      - name: Benchmark candidate
        id: candidate
        working-directory: candidate
        run: |
          dotnet run -c Release --project benchmarks/Relayer.Benchmarks -- \
            --filter '*' --anyCategories RegressionGate --exporters fulljson --keepFiles \
            --artifacts "$GITHUB_WORKSPACE/performance-results/candidate" \
            > "$GITHUB_WORKSPACE/performance-candidate.log" 2>&1 \
            || { tail -n 80 "$GITHUB_WORKSPACE/performance-candidate.log"; exit 1; }

      - name: Preserve candidate benchmark build
        if: always() && steps.candidate.outcome != 'skipped'
        run: python3 candidate/.github/scripts/retain_benchmark_evidence.py candidate performance-builds/candidate

      # Always bracket the candidate, even when the first comparison would pass.
      # This is a fixed sampling plan, not a retry of a failed measurement.
      - name: Benchmark main snapshot after candidate
        id: baseline_after
        working-directory: baseline
        run: |
          dotnet run -c Release --project benchmarks/Relayer.Benchmarks -- \
            --filter '*' --anyCategories RegressionGate --exporters fulljson --keepFiles \
            --artifacts "$GITHUB_WORKSPACE/performance-results/baseline-after" \
            > "$GITHUB_WORKSPACE/performance-baseline-after.log" 2>&1 \
            || { tail -n 80 "$GITHUB_WORKSPACE/performance-baseline-after.log"; exit 1; }

      - name: Preserve repeated baseline benchmark build
        if: always() && steps.baseline_after.outcome != 'skipped'
        run: python3 candidate/.github/scripts/retain_benchmark_evidence.py baseline performance-builds/baseline-after

      # Shared runners vary between processes by more than the 5% threshold. A failure
      # records its cases, which run once more below; only failures that repeat fail the job.
      - name: Compare bracketed throughput, allocations and startup
        id: compare
        continue-on-error: true
        run: >-
          python3 candidate/.github/scripts/benchmark_gate.py compare
          performance-results/baseline performance-results/candidate
          --baseline-after performance-results/baseline-after
          --baseline-source baseline --candidate-source candidate
          --input-manifest performance-inputs.json
          --verify-test-sources
          --summary performance-summary.md
          --failed-cases performance-failed-cases.json

      - name: Fail an unusable comparison
        if: steps.compare.outcome == 'failure' && hashFiles('performance-failed-cases.json') == ''
        run: exit 1

      # The repeated main run above, this candidate run and a final main run form a fresh
      # bracket for the failed cases only. This is the fixed confirmation plan, not a retry.
      - name: Confirm failed cases with a fresh candidate and main run
        if: steps.compare.outcome == 'failure' && hashFiles('performance-failed-cases.json') != ''
        run: |
          mapfile -t filters < <(python3 -c 'import json, sys; print("\n".join(json.load(open(sys.argv[1]))["filters"]))' performance-failed-cases.json)
          for side in candidate baseline; do
            (cd "$side" && dotnet run -c Release --project benchmarks/Relayer.Benchmarks -- \
              --filter "${filters[@]}" --exporters fulljson --keepFiles \
              --artifacts "$GITHUB_WORKSPACE/performance-results/confirm-$side" \
              > "$GITHUB_WORKSPACE/performance-confirm-$side.log" 2>&1) \
              || { tail -n 80 "performance-confirm-$side.log"; exit 1; }
          done
          python3 candidate/.github/scripts/benchmark_gate.py confirm performance-failed-cases.json \
            performance-results/baseline-after performance-results/confirm-candidate performance-results/confirm-baseline \
            --summary performance-confirmation.md

      - name: Publish comparison summary
        if: always()
        run: |
          cat performance-commits.txt >> "$GITHUB_STEP_SUMMARY"
          if [ -f performance-summary.md ]; then cat performance-summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f performance-confirmation.md ]; then cat performance-confirmation.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Retain benchmark measurements and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          path: |
            performance-builds/
            performance-results/
            performance-*.log
            performance-commits.txt
            performance-harness.sha256
            performance-inputs.json
            performance-summary.md
            performance-failed-cases.json
            performance-confirmation.md

  nats-native:
    name: NATS native-client comparisons
    if: github.event_name == 'workflow_dispatch' && inputs.nats_native == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NATS_URL: nats://127.0.0.1:4222
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x' # runtime for the net10.0 benchmarks; global.json selects the 11.0 SDK

      - name: Start native JetStream server and wait for readiness
        run: |
          docker run -d --name nats-benchmarks -p 127.0.0.1:4222:4222 -p 127.0.0.1:8222:8222 nats:2.15.2 -js -m 8222
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused 'http://127.0.0.1:8222/healthz?js-enabled-only=true'
          git rev-parse HEAD > nats-environment.txt
          dotnet --info >> nats-environment.txt
          docker inspect nats-benchmarks >> nats-environment.txt

      # Compare native and Relayer in the same build. This transport did not execute
      # messages on main, so copying these classes onto main cannot form a baseline.
      - name: Measure JSON sends, buffered dispatch and pull receive with confirmed ACK
        run: |
          dotnet run -c Release --project benchmarks/Relayer.Benchmarks -- \
            --filter '*NatsSendBenchmarks*' '*NatsAsyncSendBenchmarks*' '*NatsReceiveBenchmarks*' '*NatsWireReceiveBenchmarks*' \
            --warmupCount 5 --iterationCount 15 --launchCount 2 \
            --exporters fulljson --keepFiles --artifacts nats-results \
            > nats-benchmarks.log 2>&1 \
            || { tail -n 80 nats-benchmarks.log; exit 1; }

      # Allocation profiling runs separately so instrumentation cannot change the
      # unprofiled comparisons above. BDN attaches to its measured child processes.
      - name: Attribute native and Relayer send/receive allocations
        if: inputs.nats_allocations == true
        env:
          RELAYER_NATS_ALLOCATION_PROFILE: '1'
        run: |
          dotnet run -c Release --project benchmarks/Relayer.Benchmarks -- \
            --filter '*NatsSendBenchmarks*' '*NatsWireReceiveBenchmarks*' \
            --warmupCount 3 --iterationCount 3 --launchCount 1 \
            --exporters fulljson --keepFiles --artifacts nats-allocations \
            > nats-allocation-profile.log 2>&1 \
            || { tail -n 80 nats-allocation-profile.log; exit 1; }
          find nats-allocations -name '*.nettrace' -print -quit | grep -q .

      - name: Retain measurements, source and loaded benchmark binaries
        if: always()
        run: |
          docker logs nats-benchmarks > nats-server.log 2>&1 || true
          git archive --format=zip --output=nats-source.zip HEAD
          if [ -d benchmarks/Relayer.Benchmarks/bin/Release ]; then
            tar -czf nats-builds.tar.gz -C benchmarks/Relayer.Benchmarks/bin Release
          fi
          find . -maxdepth 1 -type f \
            \( -name 'nats-*.log' -o -name nats-environment.txt -o -name nats-source.zip -o -name nats-builds.tar.gz \) \
            -exec sha256sum {} + > nats-SHA256SUMS
          if [ -d nats-results/results ]; then
            find nats-results -type f -exec sha256sum {} + >> nats-SHA256SUMS
            cat nats-results/results/*-report-github.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -d nats-allocations ]; then
            find nats-allocations -type f -exec sha256sum {} + >> nats-SHA256SUMS
          fi
          echo 'Native NATS comparisons only; results require allocation attribution and performance review before an acceptance claim.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload native comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nats-performance-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          path: |
            nats-results/
            nats-allocations/
            nats-*.log
            nats-environment.txt
            nats-source.zip
            nats-builds.tar.gz
            nats-SHA256SUMS

      - name: Stop owned server
        if: always()
        run: docker rm -f nats-benchmarks
