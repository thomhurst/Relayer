name: Release Draft

# Keeps one draft release up to date with main: its tag is one patch above the latest release
# (see .github/scripts/release_draft.py), its target is the newest commit, and its notes list the
# changes since the latest release.
#
# To release, edit the draft on GitHub: change the tag to choose another version (for example
# v0.3.0 for a minor or v1.0.0 for a major release, or v1.0.0-rc.1 for a prerelease), adjust the
# notes, and publish it. Publishing creates the tag on the draft's commit and runs release.yml,
# which packs that commit with the tag's version and pushes the packages to NuGet.
#
# Every push to main rewrites the draft, so edits to it are lost if main moves before it is
# published. The draft this workflow owns carries DRAFT_MARKER, a hidden comment, at the end of its
# notes: keep it when editing the notes, or the next push creates a second draft. Other drafts and
# releases (such as performance evidence) are left alone.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Only the newest commit's draft matters.
concurrency:
  group: release-draft
  cancel-in-progress: true

jobs:
  draft:
    # A dispatch on another branch would point main's draft at an unmerged commit.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      DRAFT_MARKER: '<!-- relayer-release-draft -->'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The version comes from the release tags in main's history.
          persist-credentials: false

      - name: Suggest version
        id: version
        run: python3 .github/scripts/release_draft.py

      - name: Update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          set -euo pipefail
          repo="repos/$GITHUB_REPOSITORY"
          tag="v$VERSION"

          # The suggestion is above every version tag in main's history, but a tag or release for it
          # may exist elsewhere (for example a tag on another branch). Never retarget it.
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "::warning::Tag $tag already exists; leaving the draft unchanged." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if existing=$(gh api "$repo/releases/tags/$tag" --jq .html_url 2> "$RUNNER_TEMP/lookup.err"); then
            echo "::warning::Release $tag already exists ($existing); leaving the draft unchanged." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/lookup.err"; then
            cat "$RUNNER_TEMP/lookup.err" >&2
            exit 1
          fi

          notes_args=(-f tag_name="$tag" -f target_commitish="$GITHUB_SHA")
          if [ -n "$PREVIOUS_TAG" ]; then
            notes_args+=(-f previous_tag_name="$PREVIOUS_TAG")
          fi
          notes=$(gh api -X POST "$repo/releases/generate-notes" "${notes_args[@]}" --jq .body)
          body="$notes"$'\n\n'"$DRAFT_MARKER"

          draft_ids=$(gh api --paginate "$repo/releases?per_page=100" \
            --jq '.[] | select(.draft and ((.body // "") | contains(env.DRAFT_MARKER))) | .id')
          draft_id=${draft_ids%%$'\n'*}

          if [ -z "$draft_id" ]; then
            url=$(gh api -X POST "$repo/releases" \
              -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -f name="$VERSION" \
              -F draft=true -f body="$body" --jq .html_url)
          else
            # The maintainer may have published the draft since it was listed. Re-read it, and
            # never send draft=true on an update, so a published release is not turned back into a
            # draft. A publish in the instant between this read and the update can still be
            # retargeted; that window is well under a second.
            still_draft=$(gh api "$repo/releases/$draft_id" --jq .draft)
            if [ "$still_draft" != "true" ]; then
              echo "Release $draft_id was published meanwhile; leaving it unchanged." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            url=$(gh api -X PATCH "$repo/releases/$draft_id" \
              -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -f name="$VERSION" \
              -f body="$body" --jq .html_url)
          fi

          echo "Draft release $tag for $GITHUB_SHA (previous release ${PREVIOUS_TAG:-none}): $url" | tee -a "$GITHUB_STEP_SUMMARY"
