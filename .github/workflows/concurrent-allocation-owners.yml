name: Concurrent receive exact allocation owners

# Independent diagnostic, never a retry or replacement of a failed CI execution.
on:
  pull_request:
    paths:
      - '.github/workflows/concurrent-allocation-owners.yml'
      - '.github/scripts/verify_retained_ci.py'
      - '.github/scripts/test_verify_retained_ci.py'
      - 'tools/FrozenReceiveProbe/**'
      - 'tools/FrozenAllocationProfiler/**'
      - 'tools/FrozenConcurrentProbe/NativeAllocationRegion.cs'
      - '.github/scripts/read_native_allocations.py'
      - '.github/scripts/read_receive_allocations.py'
      - '.github/scripts/test_native_allocations.py'
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'Optional failed CI run whose original core-test binaries should be captured'
        type: string
        default: ''
      ci_run_attempt:
        description: 'Artifact attempt for that run'
        type: string
        default: '1'

permissions:
  contents: read
  actions: read

jobs:
  owners:
    strategy:
      fail-fast: false
      matrix:
        framework: [net10.0, net11.0]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dotnet/samples
          ref: 3810558800760fc39282cc939bac645735514209
          path: profiler-sdk
          sparse-checkout: core/profiling
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x
            11.0.100
      - name: Download retained failing inputs
        if: inputs.ci_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ inputs.ci_run_id }}
          SOURCE_ATTEMPT: ${{ inputs.ci_run_attempt }}
          FRAMEWORK: ${{ matrix.framework }}
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ && "$SOURCE_ATTEMPT" =~ ^[0-9]+$ ]]
          mkdir -p results
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > results/source-run.json
          gh run download "$SOURCE_RUN" -n "ci-test-failure-$FRAMEWORK-$SOURCE_RUN-$SOURCE_ATTEMPT" -D retained
          (cd retained && sha256sum --check .artifacts/ci-test-failure/binaries.sha256) > results/source-verification.log
          commit=$(cat retained/.artifacts/ci-test-failure/commit.txt)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GH_REPO/git/commits/$commit" > results/source-git-commit.json
          python3 .github/scripts/verify_retained_ci.py results/source-run.json retained/.artifacts/ci-test-failure/commit.txt results/source-git-commit.json
      - name: Build and record executable inputs
        id: inputs
        env:
          FRAMEWORK: ${{ matrix.framework }}
          SOURCE_RUN: ${{ inputs.ci_run_id }}
        run: |
          mkdir -p results
          dotnet --info > results/runtime.txt
          uname -a > results/host.txt
          git rev-parse HEAD > results/commit.txt
          git -C profiler-sdk rev-parse HEAD > results/profiler-sdk-commit.txt
          if [ -z "$SOURCE_RUN" ]; then
            dotnet build tests/Relayer.Tests -c Release > results/test-build.log 2>&1
            echo "TEST_IMAGE=$PWD/tests/Relayer.Tests/bin/Release/$FRAMEWORK" >> "$GITHUB_ENV"
          else
            echo "TEST_IMAGE=$PWD/retained/tests/Relayer.Tests/bin/Release/$FRAMEWORK" >> "$GITHUB_ENV"
          fi
          dotnet build tools/FrozenReceiveProbe -c Release > results/probe-build.log 2>&1
          dotnet build tools/FrozenAllocationProfiler/Fixture -c Release > results/fixture-build.log 2>&1
          CXX=clang++ cmake -S tools/FrozenAllocationProfiler -B .artifacts/exact-profiler -DPROFILER_SAMPLES="$PWD/profiler-sdk" -DCMAKE_BUILD_TYPE=Release > results/native-configure.log 2>&1
          cmake --build .artifacts/exact-profiler > results/native-build.log 2>&1
          python3 - <<'PYTHON'
          import json
          import os
          import re
          import shutil
          import subprocess
          from pathlib import Path
          path = Path('tools/FrozenAllocationProfiler/Fixture/bin/Release/net10.0/Fixture.runtimeconfig.json')
          config = json.loads(path.read_text())
          runtimes = subprocess.check_output(['dotnet', '--list-runtimes'], text=True)
          major = os.environ['FRAMEWORK'][3:].split('.')[0]
          matches = re.findall(r'^Microsoft.NETCore.App (' + major + r'\.\S+) \[(.+)\]$', runtimes, re.MULTILINE)
          if not matches:
              raise RuntimeError('No installed matching runtime; see results/runtime.txt')
          version, root = matches[-1]
          if os.environ['SOURCE_RUN']:
              original = Path('retained/.artifacts/ci-test-failure/runtime.txt').read_text()
              versions = re.findall(r'^  Microsoft.NETCore.App (' + major + r'\.\S+) ', original, re.MULTILINE)
              if not versions:
                  raise RuntimeError('Original runtime version not retained')
              version = versions[-1]
              if not any(v == version for v, _ in matches):
                  raise RuntimeError('Original runtime is not installed: ' + version)
          with Path(os.environ['GITHUB_ENV']).open('a') as env:
              env.write('CAPTURE_RUNTIME=' + version + '\n')
          Path('results/selected-runtime.txt').write_text(version + '\n')
          config['runtimeOptions']['framework']['version'] = version
          config['runtimeOptions']['rollForward'] = 'Disable'
          path.write_text(json.dumps(config, indent=2) + '\n')
          shutil.copytree(Path(root) / version, 'results/runtime-binaries')
          PYTHON
          image="${TEST_IMAGE:-$PWD/tests/Relayer.Tests/bin/Release/$FRAMEWORK}"
          if [ -n "$SOURCE_RUN" ]; then image="$PWD/retained/tests/Relayer.Tests/bin/Release/$FRAMEWORK"; fi
          find "$image" -type f -exec sha256sum {} + > results/test-inputs-before.sha256
      - name: Validate known-type callback counts
        env:
          TEST_NATIVE_PROFILER: .artifacts/exact-profiler/libFrozenAllocationProfiler.so
          TEST_NATIVE_FIXTURE: tools/FrozenAllocationProfiler/Fixture/bin/Release/net10.0/Fixture.dll
          TEST_NATIVE_OUTPUT: results/fixture
        run: python3 -m unittest discover -s .github/scripts -p test_native_allocations.py > results/native-tests.log 2>&1
      - name: Capture every outcome against the same original fixture image
        if: ${{ always() && steps.inputs.outcome == 'success' }}
        run: |
          failed=0
          dotnet --fx-version "$CAPTURE_RUNTIME" "$TEST_IMAGE/Relayer.Tests.dll" --treenode-filter '/*/*/ConcurrentReceiveAllocationTests/*' --output Detailed > results/test.log 2>&1 || failed=1
          dotnet --fx-version "$CAPTURE_RUNTIME" tools/FrozenReceiveProbe/bin/Release/${{ matrix.framework }}/FrozenReceiveProbe.dll "$TEST_IMAGE" > results/plain.log 2>&1 || failed=1
          export CORECLR_ENABLE_PROFILING=1
          export CORECLR_PROFILER='{32B7EF07-25E8-4AC7-B011-9A4321D702C8}'
          export CORECLR_PROFILER_PATH="$PWD/.artifacts/exact-profiler/libFrozenAllocationProfiler.so"
          export RELAYER_ALLOCATION_PROFILER="$CORECLR_PROFILER_PATH"
          export RELAYER_ALLOCATION_OUTPUT="$PWD/results/objects.jsonl"
          dotnet --fx-version "$CAPTURE_RUNTIME" tools/FrozenReceiveProbe/bin/Release/${{ matrix.framework }}/FrozenReceiveProbe.dll "$TEST_IMAGE" > results/exact.log 2>&1 || failed=1
          python3 .github/scripts/read_receive_allocations.py results/objects.jsonl results/exact.log > results/validated-types.json || failed=1
          sha256sum --check results/test-inputs-before.sha256 > results/test-inputs-after.log 2>&1 || failed=1
          exit "$failed"
      - name: Retain all outcomes and executable inputs
        if: always()
        run: |
          paths=()
          for path in results retained tests/Relayer.Tests/bin/Release tools/FrozenReceiveProbe/bin/Release tools/FrozenAllocationProfiler/Fixture/bin/Release .artifacts/exact-profiler profiler-sdk/core/profiling; do
            if [ -d "$path" ]; then paths+=("$path"); fi
          done
          find "${paths[@]}" -type f -exec sha256sum {} + > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: concurrent-allocation-owners-${{ matrix.framework }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            retained/
            SHA256SUMS
            tests/Relayer.Tests/bin/Release/
            tools/FrozenReceiveProbe/
            tools/FrozenConcurrentProbe/NativeAllocationRegion.cs
            tools/FrozenAllocationProfiler/
            .artifacts/exact-profiler/
            profiler-sdk/core/profiling/
            .github/scripts/read_native_allocations.py
            .github/scripts/read_receive_allocations.py
            .github/scripts/test_native_allocations.py
            .github/scripts/verify_retained_ci.py
            .github/scripts/test_verify_retained_ci.py
            .github/workflows/concurrent-allocation-owners.yml
            tests/Shared/ConcurrentReceiveFixture.cs
            Directory.Build.props
            Directory.Build.targets
            Directory.Packages.props
            global.json
          include-hidden-files: true
          retention-days: 90
