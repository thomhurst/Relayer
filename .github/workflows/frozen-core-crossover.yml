name: Frozen core DLL crossover

# New causal control for #488. Never rerun or relax the Performance gate.
on:
  pull_request:
    paths:
      - '.github/scripts/frozen_core_crossover.py'
      - '.github/scripts/test_frozen_core_crossover.py'
      - '.github/workflows/frozen-core-crossover.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  control:
    runs-on: ubuntu-26.04
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.403'
      - name: Record host and test crossover
        run: |
          mkdir -p results
          dotnet --info > results/runtime.txt
          uname -a > results/host.txt
          runtime_root="$(dirname "$(readlink -f "$(command -v dotnet)")")"
          find "$runtime_root/shared/Microsoft.NETCore.App" -type f \( -name libcoreclr.so -o -name libclrjit.so -o -name System.Private.CoreLib.dll \) -exec sha256sum {} + > results/installed-runtime-sha256.txt
          python3 -m unittest discover -s .github/scripts -p test_frozen_core_crossover.py > results/tests.log 2>&1
      - name: Download original images and execute reciprocal crossover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42823238841 --name performance-42823238841-1 --dir inputs
          python3 .github/scripts/frozen_core_crossover.py inputs results/crossover
      - name: Retain every outcome and executable image
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frozen-core-crossover-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            inputs/
            .github/scripts/frozen_core_crossover.py
            .github/scripts/test_frozen_core_crossover.py
            .github/scripts/frozen_bdn_control.py
            .github/scripts/frozen_scope_control.py
            .github/scripts/test_frozen_bdn_control.py
            .github/scripts/frozen_concurrent_control.py
            .github/workflows/frozen-core-crossover.yml
          retention-days: 90
