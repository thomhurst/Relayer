name: Frozen original BenchmarkDotNet engine control

# New historical-input experiment, never a rerun of the performance gate.
on:
  pull_request:
    paths:
      - '.github/scripts/frozen_bdn_control.py'
      - '.github/scripts/test_frozen_bdn_control.py'
      - '.github/scripts/frozen_concurrent_control.py'
      - '.github/scripts/frozen_scope_control.py'
      - '.github/workflows/frozen-bdn-control.yml'
      - 'tools/FrozenNativeHost/**'
  workflow_dispatch:
    inputs:
      performance_run:
        description: Retained Performance run to investigate (empty keeps historical default)
        required: false
        type: string

      benchmark_case:
        description: Original runner and parameter to replay
        required: true
        default: concurrent
        type: choice
        options:
          - concurrent
          - scope-only
          - scope-only-unscoped
          - scoped-dispatch
          - log-composed
          - queue-composed
          - queue-native

      parent:
        description: Native BDN pipe parent or existing console-only replay (bundled protocol comparison)
        required: true
        default: console
        type: choice
        options: [console, native]
      same_image:
        description: Hold one original image constant (abba preserves the image comparison)
        required: true
        default: abba
        type: choice
        options: [abba, baseline, candidate]
      runtime_version:
        description: Exact runtime patch (auto preserves native host selection)
        required: true
        default: auto
        type: choice
        options: [auto, '10.0.14', '10.0.15']
      jit_method:
        description: Optional child-only native JIT method filter (native parent required; diagnostic timings excluded)
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # The 11.0 SDK builds the net11.0 probes; benchmark images retained from earlier runs need the 10.0 runtime.
          dotnet-version: |
            10.0.403
            11.0.100
      - name: Install supported exact runtime patches when requested
        if: inputs.runtime_version != '' && inputs.runtime_version != 'auto'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.403
            10.0.404
      - name: Record host and verify launcher
        run: |
          mkdir -p results
          dotnet --info > results/runtime.txt
          uname -a > results/host.txt
          lscpu > results/cpu.txt
          python3 -m unittest discover -s .github/scripts -p test_frozen_bdn_control.py > results/launcher-tests.log 2>&1
      - name: Build native BenchmarkDotNet parent
        if: inputs.parent == 'native' || github.event_name == 'pull_request'
        run: dotnet build tools/FrozenNativeHost -c Release
      - name: Download original images and execute native BenchmarkDotNet ABBA
        env:
          GH_TOKEN: ${{ github.token }}
          PERFORMANCE_RUN: ${{ inputs.performance_run || '42310409459' }}
          BENCHMARK_CASE: ${{ inputs.benchmark_case || 'concurrent' }}
          SAME_IMAGE: ${{ inputs.same_image || 'abba' }}
          CONTROL_PARENT: ${{ inputs.parent || 'native' }}
          CONTROL_RUNTIME: ${{ inputs.runtime_version || 'auto' }}
          JIT_METHOD: ${{ inputs.jit_method }}
        run: |
          [[ "$PERFORMANCE_RUN" =~ ^[0-9]+$ ]] || { echo "Invalid Performance run ID: $PERFORMANCE_RUN" >&2; exit 1; }
          gh run download "$PERFORMANCE_RUN" --name "performance-$PERFORMANCE_RUN-1" --dir inputs
          control_args=(--case "$BENCHMARK_CASE")
          case "$CONTROL_PARENT" in
            console) ;;
            native) control_args+=(--native-executor tools/FrozenNativeHost/bin/Release/net10.0/FrozenNativeHost.dll) ;;
            *) echo "Invalid parent control: $CONTROL_PARENT" >&2; exit 1 ;;
          esac
          case "$SAME_IMAGE" in
            abba) ;;
            baseline|candidate) control_args+=(--same-image "$SAME_IMAGE") ;;
            *) echo "Invalid image control: $SAME_IMAGE" >&2; exit 1 ;;
          esac
          case "$CONTROL_RUNTIME" in
            auto) ;;
            10.0.14|10.0.15) control_args+=(--runtime-version "$CONTROL_RUNTIME") ;;
            *) echo "Invalid runtime control: $CONTROL_RUNTIME" >&2; exit 1 ;;
          esac
          if [[ -n "$JIT_METHOD" ]]; then
            control_args+=(--jit-method "$JIT_METHOD")
          fi
          python3 .github/scripts/frozen_bdn_control.py inputs results/original-engine "${control_args[@]}"
      - name: Retain all outcomes and executable inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frozen-bdn-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            inputs/
            .github/scripts/frozen_bdn_control.py
            .github/scripts/test_frozen_bdn_control.py
            .github/scripts/frozen_concurrent_control.py
            .github/scripts/frozen_scope_control.py
            .github/workflows/frozen-bdn-control.yml
            tools/FrozenNativeHost/Program.cs
            tools/FrozenNativeHost/FrozenNativeHost.csproj
            tools/FrozenNativeHost/bin/Release/net10.0/
          retention-days: 90
