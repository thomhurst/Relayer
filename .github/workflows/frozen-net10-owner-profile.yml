name: Frozen net10 original-waiter allocation profiles

# #488: identify sampled owner families with the original waiter and runtime major.
# Fixed-count external probe, not original adaptive-engine replay or a gate retry.
on:
  pull_request:
    paths:
      - '.github/workflows/frozen-net10-owner-profile.yml'
  workflow_dispatch:
    inputs:
      performance_run:
        description: Retained net10 Performance run for separate sampled-owner controls
        type: string
        default: "42823238841"

permissions:
  contents: read
  actions: read

jobs:
  profiles:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      PERFORMANCE_RUN: ${{ inputs.performance_run || '42823238841' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.403
            11.0.100
      - name: Record host and build external net10 probe and trace reader
        run: |
          mkdir -p results
          dotnet --info > results/runtime.txt
          uname -a > results/host.txt
          python3 -m unittest discover -s .github/scripts -p test_frozen_concurrent_control.py > results/launcher-tests.log 2>&1
          # Override only the external probe; never rebuild retained workload images.
          dotnet restore tools/FrozenConcurrentProbe -p:TargetFramework=net10.0 > results/probe-restore.log 2>&1
          dotnet build tools/FrozenConcurrentProbe -c Release -p:TargetFramework=net10.0 --no-restore > results/probe-build.log 2>&1
          dotnet build tools/FrozenAllocationReader -c Release > results/reader-build.log 2>&1
          dotnet tool install dotnet-trace --tool-path .diagnostic-tools --version 10.0.750501 > results/trace-install.log 2>&1
      - name: Download original inputs and collect original-waiter sampled ABBA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$PERFORMANCE_RUN" =~ ^[0-9]+$ ]] || { echo "Invalid run ID: $PERFORMANCE_RUN" >&2; exit 1; }
          gh run download "$PERFORMANCE_RUN" --name "performance-$PERFORMANCE_RUN-1" --dir inputs
          # Existing verifier, original BDN waiter, marker-delimited reader and
          # raw-trace retention. No identity wrappers or regional byte counters.
          # Samples are weighted and instrumentation changes scheduling: do not
          # subtract from other controls or identify historical object counts.
          python3 .github/scripts/frozen_concurrent_control.py inputs tools/FrozenConcurrentProbe/bin/Release/net10.0/FrozenConcurrentProbe.dll results/bdn-await-profiled --bdn-await --trace-tool .diagnostic-tools/dotnet-trace --profile-reader tools/FrozenAllocationReader/bin/Release/net11.0/FrozenAllocationReader.dll --keep-traces
      - name: Retain all outcomes, raw captures and executable inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frozen-net10-owner-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            inputs/
            tools/FrozenConcurrentProbe/
            tools/FrozenFixtureProbe/InvocationAllocations.cs
            tools/FrozenMeasurementEvents.cs
            tools/FrozenAllocationReader/
            .diagnostic-tools/
            .github/scripts/frozen_concurrent_control.py
            .github/workflows/frozen-net10-owner-profile.yml
          retention-days: 90
