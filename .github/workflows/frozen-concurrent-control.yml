name: Frozen concurrent allocation investigation

# A deliberate fixed-count experiment against historical executables, never a retry for green.
on:
  pull_request:
    paths:
      - 'tools/FrozenConcurrentProbe/**'
      - 'tools/FrozenFixtureProbe/InvocationAllocations.cs'
      - 'tools/FrozenMeasurementEvents.cs'
      - 'tools/FrozenAllocationReader/**'
      - 'Directory.Packages.props'
      - '.github/scripts/frozen_concurrent_control.py'
      - '.github/scripts/test_frozen_concurrent_control.py'
      - '.github/scripts/frozen_profile_summary.py'
      - '.github/scripts/test_frozen_profile_summary.py'
      - '.github/workflows/frozen-concurrent-control.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.403'
      - name: Record host and build external probe
        run: |
          mkdir -p results
          dotnet --info > results/runtime.txt
          uname -a > results/host.txt
          python3 -m unittest discover -s .github/scripts -p test_frozen_concurrent_control.py > results/verifier-tests.log 2>&1
          python3 -m unittest discover -s .github/scripts -p test_frozen_profile_summary.py > results/profile-summary-tests.log 2>&1
          dotnet build tools/FrozenConcurrentProbe -c Release > results/probe-build.log 2>&1
          dotnet build tools/FrozenAllocationReader -c Release > results/reader-build.log 2>&1
          dotnet tool install dotnet-trace --tool-path .diagnostic-tools --version 10.0.750501 > results/trace-install.log 2>&1
      - name: Download original inputs and run fixed-count ABBA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failed=0
          for run in 42306276036 42312305889 42310409459; do
            if ! gh run download "$run" --name "performance-$run-1" --dir "inputs/$run"; then
              failed=1
              continue
            fi
            python3 .github/scripts/frozen_concurrent_control.py "inputs/$run" tools/FrozenConcurrentProbe/bin/Release/net10.0/FrozenConcurrentProbe.dll "results/$run" || failed=1
          done
          exit "$failed"
      - name: Count exact synchronous full-delivery calls for run 42310409459
        if: always()
        run: python3 .github/scripts/frozen_concurrent_control.py inputs/42310409459 tools/FrozenConcurrentProbe/bin/Release/net10.0/FrozenConcurrentProbe.dll results/42310409459-exact-roundtrips --exact-roundtrips
      - name: Run separate original BDN waiter ABBA
        if: always()
        run: |
          failed=0
          for run in 42306276036 42312305889 42310409459; do
            python3 .github/scripts/frozen_concurrent_control.py "inputs/$run" tools/FrozenConcurrentProbe/bin/Release/net10.0/FrozenConcurrentProbe.dll "results/$run-bdn-await" --bdn-await || failed=1
          done
          exit "$failed"
      - name: Collect separate measured-region allocation profiles
        if: always()
        run: |
          failed=0
          for run in 42306276036 42312305889 42310409459; do
            python3 .github/scripts/frozen_concurrent_control.py "inputs/$run" tools/FrozenConcurrentProbe/bin/Release/net10.0/FrozenConcurrentProbe.dll "results/$run-profiled" --trace-tool .diagnostic-tools/dotnet-trace --profile-reader tools/FrozenAllocationReader/bin/Release/net10.0/FrozenAllocationReader.dll || failed=1
            python3 .github/scripts/frozen_concurrent_control.py "inputs/$run" tools/FrozenConcurrentProbe/bin/Release/net10.0/FrozenConcurrentProbe.dll "results/$run-bdn-await-profiled" --bdn-await --trace-tool .diagnostic-tools/dotnet-trace --profile-reader tools/FrozenAllocationReader/bin/Release/net10.0/FrozenAllocationReader.dll || failed=1
          done
          exit "$failed"
      - name: Inspect thread-resolved measured allocation owners
        if: always()
        run: |
          failed=0
          for run in 42306276036 42312305889 42310409459; do
            for mode in profiled bdn-await-profiled; do
              for launch in 1-baseline 2-candidate 3-candidate 4-baseline; do
                profile="results/$run-$mode/$launch-allocations.jsonl"
                python3 .github/scripts/frozen_profile_summary.py "$profile" > "results/$run-$mode/$launch-summary.json" || failed=1
              done
            done
          done
          exit "$failed"
      - name: Retain all outcomes and executable inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frozen-concurrent-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            inputs/
            tools/FrozenConcurrentProbe/
            tools/FrozenMeasurementEvents.cs
            tools/FrozenFixtureProbe/InvocationAllocations.cs
            tools/FrozenAllocationReader/
            .diagnostic-tools/
            .github/scripts/frozen_concurrent_control.py
            .github/scripts/frozen_profile_summary.py
          retention-days: 90
