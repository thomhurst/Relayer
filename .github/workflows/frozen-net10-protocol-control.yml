name: Frozen net10 adaptive versus fixed-count protocol control

# #537: new retained-image experiment, never a Performance gate rerun.
on:
  pull_request:
    paths:
      - '.github/workflows/frozen-net10-protocol-control.yml'
  workflow_dispatch:
    inputs:
      performance_run:
        description: Retained net10 Performance run for protocol sensitivity investigation
        type: string
        default: "43124385683"

permissions:
  contents: read
  actions: read

jobs:
  protocols:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      PERFORMANCE_RUN: ${{ inputs.performance_run || '43124385683' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.403
            11.0.100
      - name: Record execution environment and verify unchanged launchers
        run: |
          mkdir -p results
          dotnet --info > results/runtime.txt
          uname -a > results/host.txt
          lscpu > results/cpu.txt
          python3 -m unittest discover -s .github/scripts -p test_frozen_bdn_control.py > results/adaptive-tests.log 2>&1
          python3 -m unittest discover -s .github/scripts -p test_frozen_concurrent_control.py > results/fixed-tests.log 2>&1
          dotnet restore tools/FrozenConcurrentProbe -p:TargetFramework=net10.0 > results/probe-restore.log 2>&1
          dotnet build tools/FrozenConcurrentProbe -c Release -p:TargetFramework=net10.0 --no-restore > results/probe-build.log 2>&1
          cat > results/protocol-limits.txt <<'EOF'
          Same hosted machine and retained images; separate fresh processes, adaptive ABBA then fixed-count ABBA.
          Adaptive uses original generated runner, Default job, native pilot/warmup/extra GC-stat iteration and original waiter.
          Fixed uses the existing net10 external probe, 4096 warmup / 32768 measured batches and original waiter.
          Neither arm uses a profiler, source wrapper, channel replacement or rebuilt workload assembly.
          This is a bundled execution-protocol intervention, not a single warmup/count/counter variable experiment.
          Process order and host drift remain confounders. Compare each candidate only with its own baseline bracket.
          Keep operation denominators and native logs; no independent-total subtraction or gate threshold changes.
          New executions cannot identify the historical allocating owner, exact type counts or historical runtime/JIT bytes.
          A reproduced direction motivates owner-specific adaptive-engine profiling; absence does not disprove a defect.
          EOF
      - name: Download exact original images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$PERFORMANCE_RUN" =~ ^[0-9]+$ ]] || { echo "Invalid run ID: $PERFORMANCE_RUN" >&2; exit 1; }
          gh run download "$PERFORMANCE_RUN" --name "performance-$PERFORMANCE_RUN-1" --dir inputs
      - name: Execute original adaptive BenchmarkDotNet ABBA
        run: |
          python3 .github/scripts/frozen_bdn_control.py inputs results/adaptive
      - name: Execute fixed-count original-waiter ABBA even after adaptive failure
        if: always()
        run: |
          python3 .github/scripts/frozen_concurrent_control.py inputs tools/FrozenConcurrentProbe/bin/Release/net10.0/FrozenConcurrentProbe.dll results/fixed --bdn-await
      - name: Retain complete outcomes and executable inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frozen-net10-protocol-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            inputs/
            tools/FrozenConcurrentProbe/
            tools/FrozenFixtureProbe/InvocationAllocations.cs
            tools/FrozenMeasurementEvents.cs
            .github/scripts/frozen_bdn_control.py
            .github/scripts/frozen_scope_control.py
            .github/scripts/test_frozen_bdn_control.py
            .github/scripts/frozen_concurrent_control.py
            .github/scripts/test_frozen_concurrent_control.py
            .github/workflows/frozen-net10-protocol-control.yml
          retention-days: 90
