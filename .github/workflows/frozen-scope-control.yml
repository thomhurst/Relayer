name: Frozen handler resolution timing control

# New historical-input experiment, never a rerun of the performance gate.
on:
  pull_request:
    paths:
      - '.github/scripts/frozen_scope_control.py'
      - '.github/scripts/test_frozen_scope_control.py'
      - '.github/scripts/frozen_concurrent_control.py'
      - '.github/workflows/frozen-scope-control.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.403'
      - name: Record host and verify launcher
        run: |
          mkdir -p results
          dotnet --info > results/runtime.txt
          uname -a > results/host.txt
          python3 -m unittest discover -s .github/scripts -p test_frozen_scope_control.py > results/launcher-tests.log 2>&1
      - name: Download original handler-resolution images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42774764169 --name performance-42774764169-1 --dir inputs
      # #442: the distinct #437 handler-resolution loss has code captures, but
      # ScopeOnly controls cannot attribute this path. Fixed ABBA/BAAB/BAAB/ABBA
      # balances each original image across launch positions at default runtime.
      # Retain all 16 outcomes; this is not a gate retry or historical reconstruction.
      - name: Measure original scoped handler resolution in balanced blocks
        run: python3 .github/scripts/frozen_scope_control.py inputs results/handler-resolution --method ScopeAndHandlerResolution --counterbalanced
      - name: Retain all outcomes and executable inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frozen-handler-resolution-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .github/workflows/frozen-scope-control.yml
            results/
            inputs/
            .github/scripts/frozen_scope_control.py
            .github/scripts/test_frozen_scope_control.py
            .github/scripts/test_frozen_bdn_control.py
            .github/scripts/frozen_bdn_control.py
            .github/scripts/frozen_concurrent_control.py
          retention-days: 90
