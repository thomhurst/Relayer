name: Frozen scope address randomization control

# New historical-input experiment, never a rerun of the performance gate.
on:
  pull_request:
    paths:
      - '.github/scripts/frozen_scope_control.py'
      - '.github/scripts/test_frozen_scope_control.py'
      - '.github/scripts/frozen_concurrent_control.py'
      - '.github/workflows/frozen-scope-control.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # The 11.0 SDK builds the net11.0 probes; benchmark images retained from earlier runs need the 10.0 runtime.
          dotnet-version: |
            10.0.403
            11.0.100
      - name: Record host and verify launcher
        run: |
          mkdir -p results
          dotnet --info > results/runtime.txt
          uname -a > results/host.txt
          python3 -m unittest discover -s .github/scripts -p test_frozen_scope_control.py > results/launcher-tests.log 2>&1
      - name: Download original images for code attribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42772012652 --name performance-42772012652-1 --dir inputs
      # Separate layout hypothesis: default ABBA, no-ASLR BAAB/ABBA, default BAAB.
      # Native setarch changes only the child personality; rejected changes remain
      # failed outcomes. No runtime override, rebuild, gate retry or adaptive stop.
      - name: Bracket native address-randomization control with defaults
        run: python3 .github/scripts/frozen_scope_control.py inputs results/aslr --aslr-control
      - name: Retain all outcomes and executable inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frozen-scope-aslr-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .github/workflows/frozen-scope-control.yml
            results/
            inputs/
            .github/scripts/frozen_scope_control.py
            .github/scripts/test_frozen_scope_control.py
            .github/scripts/test_frozen_bdn_control.py
            .github/scripts/frozen_bdn_control.py
            .github/scripts/frozen_concurrent_control.py
          retention-days: 90
