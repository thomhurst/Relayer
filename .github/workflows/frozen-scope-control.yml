name: Frozen scope native execution sampling

# New historical-input experiment, never a rerun of the performance gate.
on:
  pull_request:
    paths:
      - '.github/scripts/frozen_scope_control.py'
      - '.github/scripts/test_frozen_scope_control.py'
      - '.github/scripts/frozen_concurrent_control.py'
      - '.github/workflows/frozen-scope-control.yml'
      - 'tools/FrozenScopeSampleReader/**'
      - 'tools/FrozenAllocationReader/RuntimeIdentityScope.cs'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # The 11.0 SDK builds the net11.0 probes; benchmark images retained from earlier runs need the 10.0 runtime.
          dotnet-version: |
            10.0.403
            11.0.100
      - name: Record host and verify launcher
        run: |
          mkdir -p results
          dotnet --info > results/runtime.txt
          uname -a > results/host.txt
          python3 -m unittest discover -s .github/scripts -p test_frozen_scope_control.py > results/launcher-tests.log 2>&1
          dotnet build tools/FrozenScopeSampleReader -c Release > results/reader-build.log 2>&1
      - name: Download original images for code attribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42772012652 --name performance-42772012652-1 --dir inputs
      # Placement maps do not say which code executed. Capture native samples,
      # method events, workload markers and same-process maps in a distinct fixed
      # default-runtime plan. Never use instrumented timings as performance data.
      - name: Sample original scope execution with native workload markers
        run: python3 .github/scripts/frozen_scope_control.py inputs results/sampling --counterbalanced --perf-map --eventpipe-sampling
      - name: Parse every retained trace even after launch failure
        if: always()
        run: |
          failed=0
          shopt -s nullglob
          traces=(results/sampling/*-samples.nettrace)
          if (( ${#traces[@]} != 16 )); then
            echo "Expected sixteen native sample captures" >&2
            failed=1
          fi
          for trace in "${traces[@]}"; do
            dotnet tools/FrozenScopeSampleReader/bin/Release/net11.0/FrozenScopeSampleReader.dll "$trace" > "$trace.jsonl" 2> "$trace.reader.log" || failed=1
          done
          exit "$failed"
      - name: Retain all outcomes and executable inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frozen-scope-sampling-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .github/workflows/frozen-scope-control.yml
            results/
            inputs/
            .github/scripts/frozen_scope_control.py
            .github/scripts/test_frozen_scope_control.py
            .github/scripts/test_frozen_bdn_control.py
            .github/scripts/frozen_bdn_control.py
            .github/scripts/frozen_concurrent_control.py
            tools/FrozenScopeSampleReader/*.cs
            tools/FrozenScopeSampleReader/*.csproj
            tools/FrozenAllocationReader/RuntimeIdentityScope.cs
          retention-days: 90
