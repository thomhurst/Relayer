name: Buffered allocation test-host overlap (#1154)

on:
  push:
    branches: [diagnostics/issue-1154-overlap-capture]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  capture:
    name: "Allocation capture (${{ matrix.workload }}, ${{ matrix.mode }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        workload: [core-only, overlap]
        mode: [counter-only, profiled]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      ORIGINAL_CHECKOUT: 0c587b95ab2f162d0caa0ce27eb93441f73bf56f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: matrix.mode == 'profiled'
        with:
          repository: dotnet/samples
          ref: 3810558800760fc39282cc939bac645735514209
          path: profiler-sdk
          sparse-checkout: core/profiling
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: |
            10.0.404
            11.0.100
      - name: Prepare broker networking
        run: sudo bash scripts/Prepare-ContainerTests.sh
      - uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6
        with:
          version: v29.10.0
          set-host: true
          daemon-config: '{"userland-proxy": false}'
      - name: Verify broker networking and prefetch images
        env:
          WORKLOAD: ${{ matrix.workload }}
        run: |
          bash scripts/Test-ContainerPortAllocation.sh
          docker pull rabbitmq:4.1.4-alpine
          if [[ "$WORKLOAD" == overlap ]]; then
            docker pull postgres:18-alpine
          fi
      - name: Build tests and record the input versions
        id: build
        env:
          CAPTURE_MODE: ${{ matrix.mode }}
          WORKLOAD: ${{ matrix.workload }}
        run: |
          mkdir -p results
          dotnet --info > results/runtime.txt
          dotnet --list-runtimes > results/runtimes.txt
          uname -a > results/host.txt
          cat /etc/os-release >> results/host.txt
          nproc >> results/host.txt
          git rev-parse HEAD > results/commit.txt
          git merge-base --is-ancestor "$ORIGINAL_CHECKOUT" HEAD
          printf '%s\n' "$ORIGINAL_CHECKOUT" > results/checkout.txt
          if [[ "$CAPTURE_MODE" == counter-only ]]; then
            git restore --source="$ORIGINAL_CHECKOUT" -- tests/Relayer.Tests/BatchPipelineTests.cs
            rm tests/Relayer.Tests/Issue1154AllocationRegion.cs
          else
            mkdir -p .artifacts/history
            git archive 489ce7079df1f92788b76dd8c8e191f46707b827 \
              tools/FrozenAllocationProfiler .github/scripts/read_native_allocations.py \
              .github/scripts/read_allocation_stacks.py | tar -x -C .artifacts/history
            CXX=clang++ cmake -S .artifacts/history/tools/FrozenAllocationProfiler \
              -B .artifacts/profiler -DPROFILER_SAMPLES="$PWD/profiler-sdk" -DCMAKE_BUILD_TYPE=Release
            cmake --build .artifacts/profiler
          fi
          dotnet build tests/Relayer.Tests -c Release -f net11.0
          if [[ "$WORKLOAD" == overlap ]]; then
            dotnet build tests/Relayer.Tracing.Tests -c Release -f net11.0
            dotnet build tests/Relayer.Outbox.PostgreSql.Tests -c Release -f net11.0
          fi
      - name: Run the focused test workload
        timeout-minutes: 6
        env:
          WORKLOAD: ${{ matrix.workload }}
          CAPTURE_MODE: ${{ matrix.mode }}
        run: bash .github/scripts/run-issue-1154-overlap.sh "$WORKLOAD" "$CAPTURE_MODE"
      - name: Validate profiled captures
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.mode == 'profiled' }}
        run: |
          status=0
          for reports in results/sample-*/core; do
            echo "$reports"
            python3 .github/scripts/summarize-issue-1154.py "$reports" \
              | tee "$reports/caller-summary.txt" || status=1
            python3 .artifacts/history/.github/scripts/read_native_allocations.py "$reports/objects.jsonl" \
              | jq 'map_values(.coverage)' > "$reports/validated-native.json" || status=1
            python3 .artifacts/history/.github/scripts/read_allocation_stacks.py "$reports/stacks.jsonl" "$reports/objects.jsonl" \
              | jq '{coverage, unresolved_frames}' > "$reports/validated-stacks.json" || status=1
          done
          exit "$status"
      - name: Inventory captured inputs and results
        if: always()
        run: |
          mkdir -p results
          inputs=(results)
          for path in tests/{Relayer.Tests,Relayer.Tracing.Tests,Relayer.Outbox.PostgreSql.Tests}/bin/Release/net11.0 \
            .artifacts/profiler/libFrozenAllocationProfiler.so; do
            if [[ -e "$path" ]]; then
              inputs+=("$path")
            fi
          done
          printf '%s\n' "${inputs[@]}" > results/upload-paths.txt
          find "${inputs[@]}" -type f -exec sha256sum {} + > results-sha256.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: allocation-overlap-${{ matrix.workload }}-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            results-sha256.txt
            tests/Relayer.Tests/bin/Release/net11.0/
            tests/Relayer.Tracing.Tests/bin/Release/net11.0/
            tests/Relayer.Outbox.PostgreSql.Tests/bin/Release/net11.0/
            .artifacts/profiler/libFrozenAllocationProfiler.so
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
