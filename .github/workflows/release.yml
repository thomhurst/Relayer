name: Release NuGet packages

# Publishing the draft release that release-draft.yml keeps for main creates the release's tag on
# the draft's commit and runs this workflow on it. The packages are stamped with the tag's version.
# The workflow file name and the `release` environment are part of the nuget.org trusted
# publishing policy: keep both.
on:
  release:
    types: [published]

permissions:
  contents: read

# Never cancel a release after some packages have already been published.
concurrency:
  group: nuget-release
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      checks: read
      id-token: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      published: ${{ steps.push.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag and required CI
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/verify_release.py

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # MinVer would also read the tag on this commit, but a commit can carry several version tags:
      # the release's own tag decides.
      - name: Pack
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: dotnet pack -c Release -o .artifacts/packages "-p:MinVerVersionOverride=$RELEASE_VERSION"

      - name: Verify package metadata, versions and symbols
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: python3 .github/scripts/verify_packages.py .artifacts/packages --commit "$RELEASE_COMMIT" --version "$RELEASE_VERSION"

      - name: Upload packages and symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nuget-packages
          path: .artifacts/packages/*.*nupkg
          if-no-files-found: error

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish packages and symbols
        id: push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push '.artifacts/packages/*.nupkg' --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          echo "published=true" >> "$GITHUB_OUTPUT"
          # Explicit symbol push repairs a partial release when the package already exists.
          dotnet nuget push '.artifacts/packages/*.snupkg' --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

  # The draft was named, and its Full Changelog link written, for the suggested version. Follow the
  # tag if it was edited before publishing. Runs once the packages are on nuget.org, even if the
  # symbol push failed. Cosmetic, so it never fails a release.
  name-release:
    needs: publish
    if: always() && needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Name release after its tag
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          body=$(gh api "$endpoint" --jq '.body // ""')
          # Only GitHub's generated line; compare links the maintainer wrote are left alone.
          body=$(printf '%s' "$body" | sed -E "/^\*\*Full Changelog\*\*: /s#(/compare/[^ )]+)\.\.\.[^ )]+#\1...$RELEASE_TAG#")
          gh api -X PATCH "$endpoint" -f name="$VERSION" -f body="$body" > /dev/null
