name: Frozen full-delivery driver allocation control

# Separate exact regional experiment, never an unchanged regression rerun.
on:
  pull_request:
    paths:
      - 'tools/FrozenDriverProbe/**'
      - '.github/scripts/summarize_frozen_driver.py'
      - '.github/scripts/test_summarize_frozen_driver.py'
      - 'tools/FrozenFixtureProbe/InvocationAllocations.cs'
      - '.github/scripts/frozen_concurrent_control.py'
      - '.github/scripts/test_frozen_concurrent_control.py'
      - '.github/workflows/frozen-driver-control.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # The 11.0 SDK builds the net11.0 probes; benchmark images retained from earlier runs need the 10.0 runtime.
          dotnet-version: |
            10.0.403
            11.0.100
      - name: Record host and build exact driver probe
        run: |
          mkdir -p results
          dotnet --info > results/runtime.txt
          uname -a > results/host.txt
          python3 -m unittest discover -s .github/scripts -p test_frozen_concurrent_control.py > results/verifier-tests.log 2>&1
          python3 -m unittest discover -s .github/scripts -p test_summarize_frozen_driver.py > results/summary-tests.log 2>&1
          dotnet build tools/FrozenDriverProbe -c Release > results/probe-build.log 2>&1
      - name: Download and verify originals before separate exact driver ABBA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failed=0
          for run in 42306276036 42312305889 42310409459; do
            if ! gh run download "$run" --name "performance-$run-1" --dir "inputs/$run"; then
              failed=1
              continue
            fi
            python3 .github/scripts/frozen_concurrent_control.py "inputs/$run" tools/FrozenDriverProbe/bin/Release/net11.0/FrozenDriverProbe.dll "results/$run-exact-driver" --exact-driver || failed=1
            python3 .github/scripts/summarize_frozen_driver.py "results/$run-exact-driver" > "results/$run-summary.json" || failed=1
          done
          exit "$failed"
      - name: Retain all outcomes and executable inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frozen-driver-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            inputs/
            tools/FrozenDriverProbe/
            tools/FrozenFixtureProbe/InvocationAllocations.cs
            tools/FrozenMeasurementEvents.cs
            .github/scripts/frozen_concurrent_control.py
            .github/scripts/summarize_frozen_driver.py
          retention-days: 90
