name: Parallel core receive allocation owners

# Independent instrumented experiment for #687, never a retry of failing CI.
on:
  pull_request:
    paths:
      - '.github/workflows/parallel-receive-allocation-owners.yml'
      - '.github/scripts/read_parallel_receive_allocations.py'
      - '.github/scripts/test_parallel_receive_allocations.py'
      - 'tests/Relayer.Tests/ConcurrentReceiveAllocationTests.cs'
      - 'tools/FrozenAllocationProfiler/**'
      - '.github/scripts/read_native_allocations.py'
      - '.github/scripts/test_native_allocations.py'
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'Optional failed CI run with original checkpoint-enabled core-test binaries'
        type: string
        default: ''
      ci_run_attempt:
        description: 'Artifact attempt for that run'
        type: string
        default: '1'
      framework:
        description: 'Framework with a retained failure artifact; both captures both'
        type: choice
        options: [both, net10.0, net11.0]
        default: 'both'
      stacks:
        description: 'Capture managed allocation stacks in a new instrumented execution'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  parallel-owners:
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ inputs.framework != '' && inputs.framework != 'both' && fromJSON(format('["{0}"]', inputs.framework)) || fromJSON('["net10.0", "net11.0"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dotnet/samples
          ref: 3810558800760fc39282cc939bac645735514209
          path: profiler-sdk
          sparse-checkout: core/profiling
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x
            11.0.100
      - name: Set up Docker for the parallel core tests
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5
        with:
          version: v29.9.3
          set-host: true
      - name: Download retained failing inputs
        if: inputs.ci_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ inputs.ci_run_id }}
          SOURCE_ATTEMPT: ${{ inputs.ci_run_attempt }}
          FRAMEWORK: ${{ matrix.framework }}
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ && "$SOURCE_ATTEMPT" =~ ^[0-9]+$ ]]
          mkdir -p results
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > results/source-run.json
          gh run download "$SOURCE_RUN" -n "ci-test-failure-$FRAMEWORK-$SOURCE_RUN-$SOURCE_ATTEMPT" -D retained
          (cd retained && sha256sum --check .artifacts/ci-test-failure/binaries.sha256) > results/source-verification.log
          commit=$(cat retained/.artifacts/ci-test-failure/commit.txt)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GH_REPO/git/commits/$commit" > results/source-git-commit.json
          python3 .github/scripts/verify_retained_ci.py results/source-run.json retained/.artifacts/ci-test-failure/commit.txt results/source-git-commit.json
      - name: Build and retain diagnostic inputs
        env:
          FRAMEWORK: ${{ matrix.framework }}
          SOURCE_RUN: ${{ inputs.ci_run_id }}
        run: |
          mkdir -p results
          dotnet --info > results/runtime.txt
          dotnet --list-runtimes > results/runtimes.txt
          uname -a > results/host.txt
          git rev-parse HEAD > results/commit.txt
          git -C profiler-sdk rev-parse HEAD > results/profiler-sdk-commit.txt
          if [ -z "$SOURCE_RUN" ]; then
            dotnet build tests/Relayer.Tests -c Release > results/test-build.log 2>&1
            image="$PWD/tests/Relayer.Tests/bin/Release/$FRAMEWORK"
          else
            image="$PWD/retained/tests/Relayer.Tests/bin/Release/$FRAMEWORK"
          fi
          echo "TEST_IMAGE=$image" >> "$GITHUB_ENV"
          dotnet build tools/FrozenAllocationProfiler/Fixture -c Release > results/fixture-build.log 2>&1
          CXX=clang++ cmake -S tools/FrozenAllocationProfiler -B .artifacts/exact-profiler -DPROFILER_SAMPLES="$PWD/profiler-sdk" -DCMAKE_BUILD_TYPE=Release > results/native-configure.log 2>&1
          cmake --build .artifacts/exact-profiler > results/native-build.log 2>&1
          python3 - <<'PYTHON'
          import json, os, re, shutil
          from pathlib import Path
          major = os.environ['FRAMEWORK'][3:].split('.')[0]
          matches = re.findall(r'^Microsoft.NETCore.App (' + major + r'\.\S+) \[(.+)\]$', Path('results/runtimes.txt').read_text(), re.MULTILINE)
          if not matches:
              raise RuntimeError('Matching runtime unavailable')
          version, root = matches[-1]
          if os.environ['SOURCE_RUN']:
              original = Path('retained/.artifacts/ci-test-failure/runtime.txt').read_text()
              versions = re.findall(r'^  Microsoft.NETCore.App (' + major + r'\.\S+) ', original, re.MULTILINE)
              if not versions:
                  raise RuntimeError('Original runtime version not retained')
              version = versions[-1]
              installed = [(v, r) for v, r in matches if v == version]
              if not installed:
                  raise RuntimeError('Original runtime is not installed: ' + version)
              _, root = installed[-1]
          fixture = Path('tools/FrozenAllocationProfiler/Fixture/bin/Release/net10.0/Fixture.runtimeconfig.json')
          config = json.loads(fixture.read_text())
          config['runtimeOptions']['framework']['version'] = version
          config['runtimeOptions']['rollForward'] = 'Disable'
          fixture.write_text(json.dumps(config, indent=2) + '\n')
          Path('results/selected-runtime.txt').write_text(version + '\n')
          shutil.copytree(Path(root) / version, 'results/runtime-binaries')
          with Path(os.environ['GITHUB_ENV']).open('a') as env:
              env.write('CAPTURE_RUNTIME=' + version + '\n')
          PYTHON
          find "$image" -type f -exec sha256sum {} + > results/test-inputs-before.sha256
      - name: Validate callback and correlation diagnostics
        env:
          TEST_NATIVE_PROFILER: .artifacts/exact-profiler/libFrozenAllocationProfiler.so
          TEST_NATIVE_FIXTURE: tools/FrozenAllocationProfiler/Fixture/bin/Release/net10.0/Fixture.dll
          TEST_NATIVE_OUTPUT: results/fixture
        run: |
          python3 -m unittest discover -s .github/scripts -p test_native_allocations.py > results/native-tests.log 2>&1
          python3 -m unittest discover -s .github/scripts -p test_parallel_receive_allocations.py > results/correlation-tests.log 2>&1
          python3 -m unittest discover -s .github/scripts -p test_allocation_stacks.py > results/stack-reader-tests.log 2>&1
      - name: Prepare core broker images
        # No test filter, scheduling throttle, GC change, threshold change or retry.
        # Keep Testcontainers image acquisition outside test lifecycle deadlines.
        run: |
          docker pull mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
          docker pull ghcr.io/shopify/toxiproxy@sha256:5d3dae09bc185dcc5ff6cf43abf6062a4a720aff0c4306a471e773acdcd107aa
      - name: Preserve counters and callbacks from the same execution
        env:
          CORECLR_ENABLE_PROFILING: '1'
          CORECLR_PROFILER: '{32B7EF07-25E8-4AC7-B011-9A4321D702C8}'
          CAPTURE_STACKS: ${{ inputs.stacks }}
        run: |
          export CORECLR_PROFILER_PATH="$PWD/.artifacts/exact-profiler/libFrozenAllocationProfiler.so"
          export RELAYER_ALLOCATION_PROFILER="$CORECLR_PROFILER_PATH"
          export RELAYER_ALLOCATION_OUTPUT="$PWD/results/parallel-objects.jsonl"
          if [ "$CAPTURE_STACKS" = true ]; then
            export RELAYER_ALLOCATION_STACKS="$PWD/results/allocation-stacks.jsonl"
          fi
          failed=0
          dotnet --fx-version "$CAPTURE_RUNTIME" "$TEST_IMAGE/Relayer.Tests.dll" --output Detailed > results/parallel-tests.log 2>&1 || failed=1
          python3 .github/scripts/read_parallel_receive_allocations.py results/parallel-objects.jsonl results/parallel-tests.log > results/validated-parallel-types.json || failed=1
          if [ "$CAPTURE_STACKS" = true ]; then
            python3 .github/scripts/read_allocation_stacks.py results/allocation-stacks.jsonl results/parallel-objects.jsonl > results/validated-stacks.json || failed=1
          fi
          sha256sum --check results/test-inputs-before.sha256 > results/test-inputs-after.log 2>&1 || failed=1
          exit "$failed"
      - name: Inventory every outcome and executable input
        if: always()
        run: |
          paths=()
          for path in results retained tests/Relayer.Tests/bin/Release tools/FrozenAllocationProfiler .artifacts/exact-profiler profiler-sdk/core/profiling .github/scripts tests/Shared/ConcurrentReceiveFixture.cs tests/Relayer.Tests/ConcurrentReceiveAllocationTests.cs tests/Relayer.Tests/Relayer.Tests.csproj tools/FrozenConcurrentProbe/NativeAllocationRegion.cs .github/workflows/parallel-receive-allocation-owners.yml Directory.Build.props Directory.Build.targets Directory.Packages.props global.json; do
            if [ -e "$path" ]; then paths+=("$path"); fi
          done
          find "${paths[@]}" -type f -exec sha256sum {} + > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: parallel-receive-owners-${{ matrix.framework }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            retained/
            tests/Relayer.Tests/bin/Release/
            tools/FrozenAllocationProfiler/
            .artifacts/exact-profiler/
            profiler-sdk/core/profiling/
            .github/scripts/
            tests/Shared/ConcurrentReceiveFixture.cs
            tests/Relayer.Tests/ConcurrentReceiveAllocationTests.cs
            tests/Relayer.Tests/Relayer.Tests.csproj
            tools/FrozenConcurrentProbe/NativeAllocationRegion.cs
            .github/workflows/parallel-receive-allocation-owners.yml
            Directory.Build.props
            Directory.Build.targets
            Directory.Packages.props
            global.json
            SHA256SUMS
          include-hidden-files: true
          retention-days: 90
