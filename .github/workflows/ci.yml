name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Drafts skip every job (see `changes`); `ready_for_review` starts CI on the reviewed head and
    # `converted_to_draft` cancels an in-flight run through the concurrency group below.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

# A newer commit on the same PR or branch cancels older in-progress runs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Auto-merge armed on an earlier head must not carry over to a new push: GitHub would merge
  # as soon as the required check passes, before anyone reviews the new head. Every push to a PR
  # with auto-merge armed disarms it; scripts/Enable-AutoMerge.ps1 re-arms after the new head's
  # review. `CI Passed` needs this job, so a failed disarm blocks the merge. Dependabot pushes
  # get a read-only token and are exempt.
  disarm-auto-merge:
    name: Disarm auto-merge
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'synchronize'
      && github.event.pull_request.auto_merge != null && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Disarm auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$PR" --disable-auto
          echo "::notice::Auto-merge disarmed by a push; re-arm with scripts/Enable-AutoMerge.ps1 after this head's review."

  # Every other job depends on this one, so drafts skip CI before renting a build runner.
  changes:
    name: Detect Changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tooling: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.tooling }}
      website: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.website }}
    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            tooling:
              - 'scripts/**'
              - '.github/scripts/**'
              - '.github/workflows/**'
            website:
              - 'website/**'
              - '.github/workflows/ci.yml'

  build:
    name: Build & Test
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for a solution
        id: solution
        run: |
          if [ -f Relayer.slnx ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::notice::No Relayer.slnx yet; skipping build."; fi

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.solution.outputs.present == 'true'
        with:
          global-json-file: global.json

      - name: Restore
        if: steps.solution.outputs.present == 'true'
        run: dotnet restore

      - name: Build
        if: steps.solution.outputs.present == 'true'
        run: dotnet build --no-restore -c Release

      - name: Test
        if: steps.solution.outputs.present == 'true'
        run: dotnet test --no-build -c Release

      - name: Native AOT smoke test
        if: steps.solution.outputs.present == 'true'
        run: |
          dotnet publish tests/Relayer.AotSmoke -c Release -r linux-x64 -o .artifacts/aot-smoke
          .artifacts/aot-smoke/Relayer.AotSmoke

  # Tests for the issue/PR loop's merge gate and the Claude review helper. They run here, not in
  # their own workflow, so `CI Passed` (and therefore auto-merge) waits for them.
  agent-tooling:
    name: Agent tooling tests
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review helper tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Merge gate and loop survey tests
        shell: pwsh
        run: |
          ./scripts/Test-AssertPrGreenReviewHeuristics.ps1
          ./scripts/Test-AssertPrGreenReviewThreads.ps1
          ./scripts/Test-AssertPrGreenChecks.ps1
          ./scripts/Test-AutoMergeProtection.ps1
          ./scripts/Test-IssuePrLoop.ps1

  # Builds the documentation site. The build fails on broken links and anchors, so a PR that
  # moves or renames a page must update every link to it. Deployment is in docs.yml.
  website:
    name: Documentation site
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # last-updated dates come from git history

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  performance:
    name: Performance regression gate
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # Pin main once. Pull requests compare to their target snapshot; pushes compare to the
      # previous main head. Manual runs compare the selected head to the current main snapshot.
      - name: Pin comparison commits
        id: commits
        working-directory: candidate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            baseline="$PR_BASE"
          elif [ "$EVENT_NAME" = push ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then
            baseline="$PUSH_BEFORE"
          else
            baseline="$(git rev-parse origin/main)"
          fi
          git cat-file -e "$baseline^{commit}"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          echo "Baseline: $baseline; candidate: $(git rev-parse HEAD)" | tee ../performance-commits.txt

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: baseline
          ref: ${{ steps.commits.outputs.baseline }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: candidate/global.json

      - name: Use identical benchmark harnesses
        run: |
          rsync -a --delete candidate/benchmarks/ baseline/benchmarks/
          cp candidate/global.json baseline/global.json
          python3 candidate/.github/scripts/pin_benchmark_version.py candidate baseline >> performance-commits.txt
          candidate_sdk="$(cd candidate && dotnet --version)"
          baseline_sdk="$(cd baseline && dotnet --version)"
          test "$candidate_sdk" = "$baseline_sdk"
          echo "SDK: $candidate_sdk" >> performance-commits.txt
          sha256sum candidate/benchmarks/Relayer.Benchmarks/*.cs > performance-harness.sha256

      - name: Test regression detector
        run: python3 -m unittest discover -s candidate/.github/scripts -p test_benchmark_gate.py -v

      - name: Benchmark main snapshot
        working-directory: baseline
        run: >-
          dotnet run -c Release --project benchmarks/Relayer.Benchmarks --
          --filter '*' --anyCategories RegressionGate --exporters fulljson
          --artifacts "$GITHUB_WORKSPACE/performance-results/baseline"
          > "$GITHUB_WORKSPACE/performance-baseline.log" 2>&1

      - name: Prove unchanged measurements pass and injected regressions fail
        run: python3 candidate/.github/scripts/benchmark_gate.py self-test performance-results/baseline

      - name: Benchmark candidate
        working-directory: candidate
        run: >-
          dotnet run -c Release --project benchmarks/Relayer.Benchmarks --
          --filter '*' --anyCategories RegressionGate --exporters fulljson
          --artifacts "$GITHUB_WORKSPACE/performance-results/candidate"
          > "$GITHUB_WORKSPACE/performance-candidate.log" 2>&1

      # Always bracket the candidate, even when the first comparison would pass.
      # This is a fixed sampling plan, not a retry of a failed measurement.
      - name: Benchmark main snapshot after candidate
        working-directory: baseline
        run: >-
          dotnet run -c Release --project benchmarks/Relayer.Benchmarks --
          --filter '*' --anyCategories RegressionGate --exporters fulljson
          --artifacts "$GITHUB_WORKSPACE/performance-results/baseline-after"
          > "$GITHUB_WORKSPACE/performance-baseline-after.log" 2>&1

      - name: Compare bracketed throughput, allocations and startup
        run: >-
          python3 candidate/.github/scripts/benchmark_gate.py compare
          performance-results/baseline performance-results/candidate
          --baseline-after performance-results/baseline-after
          --summary performance-summary.md

      - name: Publish comparison summary
        if: always()
        run: |
          cat performance-commits.txt >> "$GITHUB_STEP_SUMMARY"
          if [ -f performance-summary.md ]; then cat performance-summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Retain benchmark measurements and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            performance-results/
            performance-*.log
            performance-commits.txt
            performance-harness.sha256
            performance-summary.md

  ci-passed:
    # The required check name is computed: a job skipped by `if:` never evaluates `name`, so a
    # draft run reports this expression text instead of `CI Passed` and cannot satisfy the
    # required check (a skipped check counts as passing). Auto-merge armed right after a PR
    # leaves draft therefore waits for the ready run.
    name: ${{ needs.changes.result == 'success' && 'CI Passed' || 'CI Passed (incomplete)' }}
    needs: [disarm-auto-merge, changes, build, agent-tooling, website, performance]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all jobs succeeded or were skipped
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq .
          echo "$NEEDS_JSON" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
