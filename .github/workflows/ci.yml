name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  removal-probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            engine: v29.10.0
          - runner: ubuntu-latest
            engine: v29.9.2
          - runner: ubuntu-24.04
            engine: v29.10.0
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo bash scripts/Prepare-ContainerTests.sh
      - uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6
        with:
          version: ${{ matrix.engine }}
          set-host: true
      - run: bash scripts/Test-ContainerPortAllocation.sh
      - run: bash scripts/Probe-BrokerRemoval.sh
