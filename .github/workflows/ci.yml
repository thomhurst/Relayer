name: CI

on:
  workflow_dispatch:

run-name: Docker removal probe for #1197

permissions:
  contents: read

jobs:
  build:
    # Retain the normal isolated, parallel test run for each framework.
    name: Build & Test (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [net10.0, net11.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer needs version tags and their history.
          persist-credentials: false

      - name: Require Relayer.slnx
        run: |
          if [ ! -f Relayer.slnx ]; then
            echo "::error::Relayer.slnx is missing. Restore it or update the CI workflow if the solution moved."
            exit 1
          fi

      # This job owns its ephemeral runner. Prepare before starting the pinned
      # daemon so Docker reads the reserved range, including for Ryuk's port.
      - name: Separate Docker publications from outbound ports
        run: sudo bash scripts/Prepare-ContainerTests.sh

      # 28.0.4 misses conflicts between loopback PostgreSQL publications and
      # wildcard Testcontainers publications. 28.5.1 fixes that bookkeeping.
      - name: Set up Docker for container tests
        id: docker
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5
        with:
          version: v29.10.0
          set-host: true
          daemon-config: '{"userland-proxy": false}'

      - name: Verify mixed-address port allocation and forwarding
        run: bash scripts/Test-ContainerPortAllocation.sh

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x' # runtime for the net10.0 target; global.json selects the 11.0 SDK

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Observe dockerd during the regular parallel test run
        shell: bash
        run: |
          docker pull apache/kafka:4.0.2
          docker pull postgres:18-alpine
          docker pull mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
          docker pull mysql:8.4
          docker pull gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:112c21f8f6e04b03b393b3c34fb943a1f443e839f18c6492c364ac2e6c3ff935
          docker pull ghcr.io/shopify/toxiproxy@sha256:5d3dae09bc185dcc5ff6cf43abf6062a4a720aff0c4306a471e773acdcd107aa
          mkdir -p .artifacts/docker-exit-probe
          bash scripts/Probe-DockerExitStacks.sh .artifacts/docker-exit-probe > .artifacts/docker-exit-probe/watcher.log 2>&1 &
          watcher=$!
          trap 'kill "$watcher" 2>/dev/null || true; wait "$watcher" || true' EXIT
          dotnet test --no-build -c Release -f ${{ matrix.framework }} 2>&1 \
            | tee .artifacts/docker-exit-probe/tests.log

      - name: Compare forced removal with and without Docker networking
        if: always() && steps.docker.outcome == 'success'
        shell: bash
        run: |
          mkdir -p .artifacts/docker-removal-probe
          bash scripts/Probe-DockerExitStacks.sh .artifacts/docker-removal-probe > .artifacts/docker-removal-probe/watcher.log 2>&1 &
          watcher=$!
          trap 'kill "$watcher" 2>/dev/null || true; wait "$watcher" || true' EXIT
          bash scripts/Probe-BrokerRemoval.sh | tee .artifacts/docker-removal-probe/removals.log

      - name: Collect Docker exit diagnostics
        if: always() && steps.docker.outcome == 'success'
        run: |
          dir=$(dirname "${DOCKER_HOST#unix://}")
          mkdir -p .artifacts/docker-exit-probe
          sudo cat "$dir/dockerd.log" > .artifacts/docker-exit-probe/daemon.log
          sudo find "$dir/execroot" -maxdepth 1 -type f -name 'goroutine-stacks-*.log' \
            -exec cp {} .artifacts/docker-exit-probe/ \;
          sudo chmod a+r .artifacts/docker-exit-probe/*

      - name: Retain Docker exit diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: docker-exit-probe-${{ matrix.framework }}-${{ github.run_attempt }}
          path: |
            .artifacts/docker-exit-probe/
            .artifacts/docker-removal-probe/
          if-no-files-found: error
          retention-days: 7
