name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Drafts skip every job (see `changes`); `ready_for_review` starts CI on the reviewed head and
    # `converted_to_draft` cancels an in-flight run through the concurrency group below.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

# A newer validating run cancels older runs for the same PR or branch. Ordinary draft
# events use a separate group: a delayed draft event must not cancel a ready run,
# or replace a pending one (even cancel-in-progress: false replaces pending runs).
# Converting back to draft deliberately shares the validation group to cancel CI.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'pull_request' && github.event.pull_request.draft && github.event.action != 'converted_to_draft' && '-draft' || '' }}
  cancel-in-progress: true

jobs:
  # Auto-merge armed on an earlier head must not carry over to a new push: GitHub would merge
  # as soon as the required check passes, before anyone reviews the new head. Every push to a PR
  # with auto-merge armed disarms it; scripts/Enable-AutoMerge.ps1 re-arms after the new head's
  # review. `CI Passed` needs this job, so a failed disarm blocks the merge. Dependabot pushes
  # get a read-only token and are exempt.
  disarm-auto-merge:
    name: Disarm auto-merge
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'synchronize'
      && github.event.pull_request.auto_merge != null && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Disarm auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$PR" --disable-auto
          echo "::notice::Auto-merge disarmed by a push; re-arm with scripts/Enable-AutoMerge.ps1 after this head's review."

  # Every other job depends on this one, so drafts skip CI before renting a build runner.
  changes:
    name: Detect Changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tooling: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.tooling }}
      website: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.website }}
    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            tooling:
              - 'renovate.json'
              - 'scripts/**'
              - '.github/scripts/**'
              - '.github/workflows/**'
            website:
              - 'website/**'
              - '.github/workflows/ci.yml'

  build:
    # One leg per target framework: both legs build the whole solution, then test and publish the
    # Native AOT smokes for their framework only. Running both frameworks' test processes on one
    # runner starts every broker container twice and times their startup out.
    name: Build & Test (${{ matrix.framework }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [net10.0, net11.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer needs version tags and their history.

      # This job owns its ephemeral runner. Prepare before starting the pinned
      # daemon so Docker reads the reserved range, including for Ryuk's port.
      - name: Separate Docker publications from outbound ports
        run: sudo bash scripts/Prepare-ContainerTests.sh

      # 28.0.4 misses conflicts between loopback PostgreSQL publications and
      # wildcard Testcontainers publications. 28.5.1 fixes that bookkeeping.
      - name: Set up Docker for container tests
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5
        with:
          version: v29.9.3
          set-host: true

      - name: Verify mixed-address port allocation
        run: bash scripts/Test-ContainerPortAllocation.sh

      - name: Check for a solution
        id: solution
        run: |
          if [ -f Relayer.slnx ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::notice::No Relayer.slnx yet; skipping build."; fi

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: steps.solution.outputs.present == 'true'
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x' # runtime for the net10.0 target; global.json selects the 11.0 SDK

      - name: Restore
        if: steps.solution.outputs.present == 'true'
        run: dotnet restore

      - name: Build
        if: steps.solution.outputs.present == 'true'
        run: dotnet build --no-restore -c Release

      - name: Test
        id: tests
        shell: bash
        if: steps.solution.outputs.present == 'true'
        # Keep image acquisition outside Kafka's lifecycle deadline and
        # PostgreSQL/MySQL bounded docker run commands.
        run: |
          docker pull apache/kafka:4.0.2
          docker pull postgres:18-alpine
          docker pull mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
          docker pull mysql:8.4
          docker pull gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:112c21f8f6e04b03b393b3c34fb943a1f443e839f18c6492c364ac2e6c3ff935
          docker pull ghcr.io/shopify/toxiproxy@sha256:5d3dae09bc185dcc5ff6cf43abf6062a4a720aff0c4306a471e773acdcd107aa
          mkdir -p .artifacts/ci-test-failure
          # Bash pipefail preserves the test exit code; tee retains the original parallel run.
          dotnet test --no-build -c Release -f ${{ matrix.framework }} 2>&1 | tee .artifacts/ci-test-failure/tests.log

      - name: Collect failing test inputs
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          mkdir -p .artifacts/ci-test-failure
          dotnet --info > .artifacts/ci-test-failure/runtime.txt
          uname -a > .artifacts/ci-test-failure/host.txt
          git rev-parse HEAD > .artifacts/ci-test-failure/commit.txt
          git archive --format=zip HEAD -o .artifacts/ci-test-failure/source.zip
          # No rebuild: retain the core-test executable/dependencies used by this matrix leg.
          # Allowlisted paths exclude environment variables, credentials and broker container data.
          find "tests/Relayer.Tests/bin/Release/${{ matrix.framework }}" -type f -print0 \
            | sort -z | xargs -0 sha256sum > .artifacts/ci-test-failure/binaries.sha256

      - name: Retain failing test inputs
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-test-failure-${{ matrix.framework }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/ci-test-failure/
            tests/Relayer.Tests/bin/Release/${{ matrix.framework }}/
          include-hidden-files: true
          if-no-files-found: error
          # Diagnostic inputs are downloadable by reviewers; retain for 14 days, not indefinitely.
          retention-days: 14

      - name: Pack and verify NuGet artifacts
        if: matrix.framework == 'net11.0'
        run: |
          dotnet pack --no-build -c Release -o .artifacts/packages
          python3 .github/scripts/verify_packages.py .artifacts/packages --commit "$GITHUB_SHA"

      - name: Native AOT smoke test
        if: steps.solution.outputs.present == 'true'
        run: |
          dotnet publish tests/Relayer.AotSmoke -c Release -f ${{ matrix.framework }} -r linux-x64 -o .artifacts/aot-smoke
          .artifacts/aot-smoke/Relayer.AotSmoke

      - name: Native AOT dead-letter HTTP smoke
        if: steps.solution.outputs.present == 'true'
        run: |
          dotnet publish tests/Relayer.AspNetCore.AotSmoke -c Release -f ${{ matrix.framework }} -r linux-x64 -o .artifacts/dead-letter-http-aot
          .artifacts/dead-letter-http-aot/Relayer.AspNetCore.AotSmoke

      - name: Google Pub/Sub Native AOT smoke test
        if: steps.solution.outputs.present == 'true'
        env:
          PUBSUB_EMULATOR_HOST: 127.0.0.1:8085
        run: |
          dotnet publish tests/Relayer.GooglePubSub.AotSmoke -c Release -f ${{ matrix.framework }} -r linux-x64 -o .artifacts/pubsub-aot
          container=$(docker run -d -p 127.0.0.1:8085:8085 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:112c21f8f6e04b03b393b3c34fb943a1f443e839f18c6492c364ac2e6c3ff935 \
            gcloud beta emulators pubsub start --project=relayer-test --host-port=0.0.0.0:8085 --quiet)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          ready=false
          for attempt in {1..60}; do
            if docker logs "$container" 2>&1 | grep -q 'Server started, listening on 8085'; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs "$container"
            exit 1
          fi
          .artifacts/pubsub-aot/Relayer.GooglePubSub.AotSmoke

  # Tests for the issue/PR loop's merge gate and the Claude review helper. They run here, not in
  # their own workflow, so `CI Passed` (and therefore auto-merge) waits for them.
  agent-tooling:
    name: Agent tooling tests
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review helper tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Merge gate and loop survey tests
        shell: pwsh
        run: |
          ./scripts/Test-AssertPrGreenReviewHeuristics.ps1
          ./scripts/Test-AssertPrGreenReviewThreads.ps1
          ./scripts/Test-AssertPrGreenChecks.ps1
          ./scripts/Test-AutoMergeProtection.ps1
          ./scripts/Test-GateScriptSource.ps1
          ./scripts/Test-IssuePrLoop.ps1
          ./scripts/Test-AgentLocksDocker.ps1

  # Builds the documentation site. The build fails on broken links and anchors, so a PR that
  # moves or renames a page must update every link to it. Deployment is in docs.yml.
  website:
    name: Documentation site
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # last-updated dates come from git history

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  ci-passed:
    # The required check name is computed: a job skipped by `if:` never evaluates `name`, so a
    # draft run reports this expression text instead of `CI Passed` and cannot satisfy the
    # required check (a skipped check counts as passing). Auto-merge armed right after a PR
    # leaves draft therefore waits for the ready run.
    name: ${{ needs.changes.result == 'success' && 'CI Passed' || 'CI Passed (incomplete)' }}
    needs: [disarm-auto-merge, changes, build, agent-tooling, website]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all jobs succeeded or were skipped
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq .
          echo "$NEEDS_JSON" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
