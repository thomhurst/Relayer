name: Frozen exact CLR allocation callback control

# Separate instrumented execution for #488; never a Performance-gate rerun.
on:
  pull_request:
    paths:
      - '.github/workflows/frozen-exact-allocation-control.yml'
  workflow_dispatch:
    inputs:
      performance_run:
        description: Retained Performance inputs
        type: string
        default: '42823238841'

permissions:
  contents: read
  actions: read

jobs:
  allocations:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PERFORMANCE_RUN: ${{ inputs.performance_run || '42823238841' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dotnet/samples
          ref: 3810558800760fc39282cc939bac645735514209
          path: profiler-sdk
          sparse-checkout: core/profiling
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.403
            11.0.100
      - name: Build native profiler and net10 external probe
        run: |
          mkdir -p results
          dotnet --info > results/runtime.txt
          uname -a > results/host.txt
          git -C profiler-sdk rev-parse HEAD > results/profiler-sdk-commit.txt
          CXX=clang++ cmake -S tools/FrozenAllocationProfiler -B .artifacts/exact-profiler -DPROFILER_SAMPLES="$PWD/profiler-sdk" -DCMAKE_BUILD_TYPE=Release > results/native-configure.log 2>&1
          cmake --build .artifacts/exact-profiler > results/native-build.log 2>&1
          dotnet build tools/FrozenAllocationProfiler/Fixture -c Release > results/fixture-build.log 2>&1
          dotnet restore tools/FrozenConcurrentProbe -p:TargetFramework=net10.0 > results/probe-restore.log 2>&1
          dotnet build tools/FrozenConcurrentProbe -c Release -p:TargetFramework=net10.0 --no-restore > results/probe-build.log 2>&1
      - name: Validate exact known-type counts before interpreting frozen workloads
        env:
          TEST_NATIVE_PROFILER: .artifacts/exact-profiler/libFrozenAllocationProfiler.so
          TEST_NATIVE_FIXTURE: tools/FrozenAllocationProfiler/Fixture/bin/Release/net10.0/Fixture.dll
          TEST_NATIVE_OUTPUT: results/fixture
        run: |
          python3 -m unittest discover -s .github/scripts -p test_native_allocations.py > results/native-tests.log 2>&1
          python3 -m unittest discover -s .github/scripts -p test_frozen_concurrent_control.py > results/launcher-tests.log 2>&1
      - name: Verify original inputs and count every reported CLR heap allocation in ABBA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$PERFORMANCE_RUN" =~ ^[0-9]+$ ]] || { echo "Invalid run ID: $PERFORMANCE_RUN" >&2; exit 1; }
          gh run download "$PERFORMANCE_RUN" --name "performance-$PERFORMANCE_RUN-1" --dir inputs
          python3 .github/scripts/frozen_concurrent_control.py inputs tools/FrozenConcurrentProbe/bin/Release/net10.0/FrozenConcurrentProbe.dll results/exact-allocations --bdn-await --allocation-profiler .artifacts/exact-profiler/libFrozenAllocationProfiler.so
          python3 .github/scripts/read_native_allocations.py results/exact-allocations/*-objects.jsonl > results/exact-allocations/validated-types.json
      - name: Preserve every outcome and executable input, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frozen-exact-allocation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            inputs/
            profiler-sdk/core/profiling/
            profiler-sdk/LICENSE
            .artifacts/exact-profiler/
            tools/FrozenAllocationProfiler/
            tools/FrozenConcurrentProbe/
            tools/FrozenFixtureProbe/InvocationAllocations.cs
            tools/FrozenMeasurementEvents.cs
            .github/scripts/frozen_concurrent_control.py
            .github/scripts/read_native_allocations.py
            .github/scripts/test_native_allocations.py
            .github/workflows/frozen-exact-allocation-control.yml
          retention-days: 90
