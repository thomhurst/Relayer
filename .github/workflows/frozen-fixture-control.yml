name: Frozen handler fixture allocation control

# A deliberate fixed-count experiment against historical executables, never a retry for green.
on:
  pull_request:
    paths:
      - 'tools/FrozenFixtureProbe/**'
      - 'tools/FrozenAllocationReader/**'
      - 'tools/FrozenMeasurementEvents.cs'
      - 'Directory.Packages.props'
      - '.github/scripts/frozen_concurrent_control.py'
      - '.github/scripts/test_frozen_concurrent_control.py'
      - '.github/workflows/frozen-fixture-control.yml'
  workflow_dispatch:
    inputs:
      performance_run:
        description: Optional retained Performance run instead of historical controls
        type: string
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PERFORMANCE_RUNS: ${{ inputs.performance_run || '42306276036 42312305889 42310409459' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.403'
      - name: Record host and build external probe
        run: |
          mkdir -p results
          dotnet --info > results/runtime.txt
          uname -a > results/host.txt
          python3 -m unittest discover -s .github/scripts -p test_frozen_concurrent_control.py > results/verifier-tests.log 2>&1
          dotnet build tools/FrozenFixtureProbe -c Release > results/probe-build.log 2>&1
          dotnet build tools/FrozenAllocationReader -c Release > results/reader-build.log 2>&1
          dotnet tool install dotnet-trace --tool-path .diagnostic-tools --version 10.0.750501 > results/trace-install.log 2>&1
      - name: Validate selected retained run IDs
        run: |
          [[ "$PERFORMANCE_RUNS" =~ [^[:space:]] ]] || { echo "Select at least one numeric run ID" >&2; exit 1; }
          for run in $PERFORMANCE_RUNS; do
            [[ "$run" =~ ^[0-9]+$ ]] || { echo "Invalid run ID: $run" >&2; exit 1; }
          done
      - name: Download original inputs and run fixed-count ABBA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failed=0
          for run in $PERFORMANCE_RUNS; do
            if ! gh run download "$run" --name "performance-$run-1" --dir "inputs/$run"; then
              failed=1
              continue
            fi
            python3 .github/scripts/frozen_concurrent_control.py "inputs/$run" tools/FrozenFixtureProbe/bin/Release/net10.0/FrozenFixtureProbe.dll "results/$run" || failed=1
          done
          exit "$failed"
      - name: Collect separate measured-region fixture profiles
        if: always()
        run: |
          failed=0
          for run in $PERFORMANCE_RUNS; do
            python3 .github/scripts/frozen_concurrent_control.py "inputs/$run" tools/FrozenFixtureProbe/bin/Release/net10.0/FrozenFixtureProbe.dll "results/$run-profiled" --trace-tool .diagnostic-tools/dotnet-trace --profile-reader tools/FrozenAllocationReader/bin/Release/net10.0/FrozenAllocationReader.dll --keep-traces || failed=1
          done
          exit "$failed"
      - name: Run separate exact synchronous invocation ABBA
        if: always()
        run: |
          failed=0
          for run in $PERFORMANCE_RUNS; do
            python3 .github/scripts/frozen_concurrent_control.py "inputs/$run" tools/FrozenFixtureProbe/bin/Release/net10.0/FrozenFixtureProbe.dll "results/$run-exact-invocations" --exact-invocations || failed=1
          done
          exit "$failed"
      - name: Run separate exact release batch ABBA
        if: always()
        run: |
          failed=0
          for run in $PERFORMANCE_RUNS; do
            python3 .github/scripts/frozen_concurrent_control.py "inputs/$run" tools/FrozenFixtureProbe/bin/Release/net10.0/FrozenFixtureProbe.dll "results/$run-exact-releases" --exact-releases || failed=1
          done
          exit "$failed"
      - name: Retain all outcomes and executable inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frozen-fixture-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            inputs/
            tools/FrozenFixtureProbe/
            tools/FrozenMeasurementEvents.cs
            tools/FrozenAllocationReader/
            .diagnostic-tools/
            .github/scripts/frozen_concurrent_control.py
          retention-days: 90
