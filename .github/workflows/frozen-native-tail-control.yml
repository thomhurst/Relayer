name: Frozen adaptive native GC-stat tail profiles

# #488/#537: new instrumented retained-image experiment, never a Performance gate rerun.
on:
  pull_request:
    paths:
      - '.github/workflows/frozen-native-tail-control.yml'
  workflow_dispatch:
    inputs:
      performance_run:
        description: Retained net10 Performance run
        type: string
        default: "43124385683"
      same_image:
        description: Negative control image (abba keeps baseline/candidate ABBA)
        type: choice
        options:
          - abba
          - baseline
          - candidate
        default: abba

      runtime_version:
        description: Exact runtime patch for a separate native-tail control
        type: choice
        options: ['10.0.14', '10.0.15']
        default: '10.0.14'

permissions:
  contents: read
  actions: read

jobs:
  tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PERFORMANCE_RUN: ${{ inputs.performance_run || '42823238841' }}
      CONTROL_RUNTIME: ${{ inputs.runtime_version || '10.0.14' }}
      SAME_IMAGE: ${{ inputs.same_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.403
            10.0.404
            11.0.100
      - name: Record environment and build reader
        run: |
          mkdir -p results
          dotnet --info > results/runtime.txt
          uname -a > results/host.txt
          lscpu > results/cpu.txt
          python3 - <<'PYTHON'
          import hashlib, json, os
          from pathlib import Path
          version = os.environ['CONTROL_RUNTIME']
          if version not in ('10.0.14', '10.0.15'):
              raise ValueError('Unsupported runtime: ' + version)
          root = Path(os.environ['DOTNET_ROOT']) / 'shared/Microsoft.NETCore.App' / version
          if not root.is_dir():
              raise ValueError('Requested runtime is not installed: ' + str(root))
          files = [{'path': str(p.relative_to(root)), 'length': p.stat().st_size,
                    'sha256': hashlib.sha256(p.read_bytes()).hexdigest()}
                   for p in sorted(root.rglob('*')) if p.is_file()]
          Path('results/selected-runtime.json').write_text(json.dumps(
              {'version': version, 'files': files,
               'limits': 'Installed bytes, not historical loaded-binary identity proof.'}, indent=2) + '\n')
          PYTHON
          python3 -m unittest discover -s .github/scripts -p test_frozen_bdn_control.py > results/launcher-tests.log 2>&1
          dotnet build tools/FrozenAllocationReader -c Release > results/reader-build.log 2>&1
          dotnet tool install dotnet-trace --tool-path .diagnostic-tools --version 10.0.750501 > results/trace-install.log 2>&1
          cat > results/limits.txt <<'LIMITS'
          Original retained BDN 0.15.8 adaptive job, waiter and workload images, net10 x64.
          Native EngineEventSource bounds the final WorkloadActualStop to BenchmarkStop tail.
          Engine.GetExtraStats runs inside this envelope, but so do final timed-iteration cleanup/GC/logging and stats setup/cleanup.
          These are not exact MeasureWithGc boundaries. Retain full native event history and compare its final denominator with // GC.
          Instrumentation changes scheduling. In default ABBA mode, compare candidates only within their complete bracket.
          A requested same-image control holds the executable constant; it is not a baseline/candidate comparison.
          Weighted allocation samples are not exact bytes or object counts; missing stacks remain unattributed.
          No subtraction of independent totals, historical owner attribution, demonstrated defect, performance trade-off or threshold change.
          Retain raw traces, complete stacks/runtime/module events and every failed outcome; missing native coverage fails closed.
          LIMITS
      - name: Download original inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$PERFORMANCE_RUN" =~ ^[0-9]+$ ]] || { echo "Invalid run ID: $PERFORMANCE_RUN" >&2; exit 1; }
          gh run download "$PERFORMANCE_RUN" --name "performance-$PERFORMANCE_RUN-1" --dir inputs
      - name: Profile four original adaptive launches with native engine events
        run: |
          control_args=()
          if [[ -n "$SAME_IMAGE" && "$SAME_IMAGE" != abba ]]; then control_args+=(--same-image "$SAME_IMAGE"); fi
          python3 .github/scripts/frozen_bdn_control.py inputs results/adaptive --trace-tool .diagnostic-tools/dotnet-trace --runtime-version "$CONTROL_RUNTIME" "${control_args[@]}"
      - name: Read all native-tail owner groups even after launch failure
        if: always()
        run: |
          failed=0
          shopt -s nullglob
          traces=(results/adaptive/*.nettrace)
          if (( ${#traces[@]} != 4 )); then
            echo "Expected four native allocation captures" >&2
            failed=1
          fi
          for trace in "${traces[@]}"; do
            launch="$(basename "$trace" .nettrace)"
            dotnet tools/FrozenAllocationReader/bin/Release/net11.0/FrozenAllocationReader.dll "results/adaptive/$launch.nettrace" --bdn-tail > "results/$launch-tail.jsonl" 2> "results/$launch-reader.log" || failed=1
          done
          exit "$failed"
      - name: Cross-check every native tail denominator
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          outcomes = json.loads(Path('results/adaptive/outcomes.json').read_text())
          assert len(outcomes) == 4
          for outcome in outcomes:
              assert outcome.get('runtime') == os.environ['CONTROL_RUNTIME'], outcome
              assert outcome.get('operations', 0) > 0, (outcome['launch'], outcome['side'], outcome.get('error', 'missing native operations'))
              path = Path(f"results/{outcome['launch']}-{outcome['side']}-tail.jsonl")
              records = [json.loads(line) for line in path.read_text().splitlines()]
              runtimes = [r['payload'] for r in records
                          if r['kind'] == 'runtime-module-event' and r['EventName'] == 'Runtime/Start']
              assert runtimes and all('.'.join(r[k] for k in
                  ('BclMajorVersion', 'BclMinorVersion', 'BclBuildNumber')) == os.environ['CONTROL_RUNTIME']
                  for r in runtimes), (path, 'captured runtime mismatch')
              scopes = [r for r in records if r['kind'] == 'native-engine-tail']
              assert len(scopes) == 1, (path, 'missing or ambiguous tail')
              assert scopes[0]['nativeOperations'] == outcome['operations'], (path, 'denominator mismatch')
          PY
      - name: Retain every outcome and executable input
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frozen-native-tail-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            inputs/
            tools/FrozenAllocationReader/
            .diagnostic-tools/
            .github/scripts/frozen_bdn_control.py
            .github/scripts/frozen_concurrent_control.py
            .github/scripts/test_frozen_bdn_control.py
            .github/workflows/frozen-native-tail-control.yml
          retention-days: 90
